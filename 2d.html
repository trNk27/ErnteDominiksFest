<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2e4d2e">
<link rel="icon" href="data:,">
<title>ErnteDominiksFest 🌳</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:#2e4d2e; color:#fff;
    display:flex; flex-direction:column;
    padding-top: env(safe-area-inset-top);
    user-select:none; -webkit-user-select:none;
  }
  button { font-family:inherit; }

  /* ---------- HUD ---------- */
  #hud {
    display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px;
    padding:6px 8px; background:#1d331d; border-bottom:2px solid #142414;
    font-size:clamp(11px,2.8vw,14px); font-weight:600; z-index:20;
  }
  #hud .title { font-weight:800; letter-spacing:.02em; color:#ffd76a; margin-right:2px; }
  #hud .stat { white-space:nowrap; }
  #daybarwrap { width:52px; height:7px; background:#0e1c0e; border-radius:4px; overflow:hidden; display:inline-block; vertical-align:middle; }
  #daybar { height:100%; width:0%; background:linear-gradient(90deg,#ffd76a,#ff9d3c); }
  #hud .spacer { flex:1; }
  #hud button {
    background:#3f6b3f; color:#fff; border:none; border-radius:8px;
    padding:5px 10px; font-size:inherit; font-weight:700; cursor:pointer;
  }
  #hud button:active { transform:scale(.95); }
  #btnShop { background:#b0722a; }
  #inv { display:flex; gap:8px; font-size:clamp(11px,2.6vw,13px); }
  #inv span.zero { opacity:.4; }

  /* ---------- Queue bar ---------- */
  #queuebar {
    display:flex; gap:5px; padding:5px 6px; background:#244024;
    border-bottom:2px solid #142414; z-index:20;
  }
  .charsec {
    flex:1 1 0; min-width:0; display:flex; align-items:center; gap:5px;
    background:#1b301b; border:2px solid #2f4f2f; border-radius:10px; padding:4px 5px;
    cursor:pointer; transition:border-color .12s, box-shadow .12s;
  }
  .charsec.sel { border-color:var(--cc); box-shadow:0 0 8px var(--cc); }
  .charsec .pwrap { position:relative; flex:0 0 auto; }
  .charsec canvas { display:block; width:38px; height:38px; border-radius:50%; background:#0d180d; border:2px solid var(--cc); }
  .charsec .cinfo { flex:1 1 auto; min-width:0; }
  .charsec .cname { font-size:10px; font-weight:800; color:var(--cc); line-height:1.1; }
  .charsec .cstats { font-size:10px; opacity:.9; white-space:nowrap; }
  .chips { display:flex; gap:3px; margin-top:2px; overflow-x:auto; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    position:relative; flex:0 0 auto; background:#375c37; border-radius:6px;
    font-size:11px; padding:2px 5px; line-height:1.3; cursor:pointer; overflow:hidden;
    border:1px solid #4a774a;
  }
  .chip .fill { position:absolute; left:0; top:0; bottom:0; width:0%; background:rgba(255,215,106,.35); }
  .chip .lbl { position:relative; }
  .chip.cur { border-color:#ffd76a; }
  .chip:active { transform:scale(.9); }

  /* ---------- Canvas ---------- */
  #wrap { flex:1; position:relative; overflow:hidden; background:#5da03f; }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  /* ---------- Toasts ---------- */
  #toasts {
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; gap:5px; align-items:center; z-index:40; pointer-events:none;
    width:max-content; max-width:92%;
  }
  .toast {
    background:rgba(20,35,20,.92); border:1px solid #4a774a; color:#fff;
    padding:6px 14px; border-radius:18px; font-size:clamp(12px,3vw,14px); font-weight:600;
    animation:tin .25s ease-out; text-align:center; max-width:100%;
  }
  .toast.warn { border-color:#ffb33c; color:#ffd76a; }
  .toast.bad { border-color:#ff5c5c; color:#ffb0b0; }
  .toast.good { border-color:#7dff8a; color:#c9ffcf; }
  @keyframes tin { from { opacity:0; transform:translateY(-8px);} to {opacity:1; transform:none;} }
  .toast.out { opacity:0; transition:opacity .4s; }

  /* ---------- Action menu ---------- */
  #amenu {
    position:absolute; z-index:35; display:flex; flex-direction:column; gap:4px;
    background:rgba(20,35,20,.96); border:2px solid #4a774a; border-radius:12px; padding:6px;
    min-width:150px; box-shadow:0 6px 18px rgba(0,0,0,.45);
  }
  #amenu.hidden { display:none; }
  #amenu .mtitle { font-size:11px; font-weight:800; opacity:.8; text-align:center; padding:0 4px 2px; }
  #amenu button {
    display:flex; align-items:center; gap:8px; background:#375c37; border:1px solid #4a774a;
    color:#fff; border-radius:8px; padding:8px 10px; font-size:14px; font-weight:700; cursor:pointer;
    text-align:left;
  }
  #amenu button:active { transform:scale(.96); }
  #amenu button .cnt { margin-left:auto; font-size:11px; opacity:.75; }
  #amenu button:disabled { opacity:.45; }

  /* ---------- Modals ---------- */
  #modal {
    position:absolute; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.6); padding:14px;
  }
  #modal.hidden { display:none; }
  #mbox {
    background:#1d331d; border:3px solid #4a774a; border-radius:16px;
    max-width:440px; width:100%; max-height:88%; overflow-y:auto; padding:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.6);
  }
  #mbox h2 { color:#ffd76a; font-size:20px; margin-bottom:8px; text-align:center; }
  #mbox p { font-size:14px; line-height:1.5; margin-bottom:8px; }
  #mbox .btnrow { display:flex; gap:8px; margin-top:12px; }
  #mbox .btnrow button {
    flex:1; background:#3f6b3f; border:none; color:#fff; font-weight:800;
    padding:10px; border-radius:10px; font-size:15px; cursor:pointer;
  }
  #mbox .btnrow button.primary { background:#b0722a; }
  #mbox .btnrow button:active { transform:scale(.97); }
  .shopitem {
    display:flex; align-items:center; gap:10px; background:#244024;
    border:1px solid #375c37; border-radius:10px; padding:8px; margin-bottom:7px;
  }
  .shopitem .ico { font-size:24px; flex:0 0 auto; }
  .shopitem .txt { flex:1; min-width:0; }
  .shopitem .nm { font-weight:800; font-size:14px; }
  .shopitem .ds { font-size:11.5px; opacity:.8; line-height:1.3; }
  .shopitem .own { font-size:11px; color:#ffd76a; }
  .shopitem button {
    flex:0 0 auto; background:#b0722a; border:none; color:#fff; font-weight:800;
    padding:8px 10px; border-radius:8px; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .shopitem button:disabled { background:#444; opacity:.6; }
  .shopitem button:active:not(:disabled) { transform:scale(.95); }
  #shopmoney { text-align:center; font-weight:800; color:#ffd76a; margin-bottom:10px; font-size:16px; }
  .tut li { font-size:13.5px; line-height:1.5; margin:0 0 7px 18px; }

  #loading {
    position:absolute; inset:0; z-index:60; background:#1d331d; display:flex;
    align-items:center; justify-content:center; flex-direction:column; gap:10px;
    font-weight:800; color:#ffd76a; font-size:18px;
  }
</style>

<body>

<div id="hud">
  <span class="title">🌳 ErnteDominiksFest</span>
  <span class="stat">💰 <span id="hMoney">0</span> €</span>
  <span class="stat">📅 Tag <span id="hDay">1</span> <span id="daybarwrap"><span id="daybar"></span></span></span>
  <span class="stat">📈 <span id="hPrice">12</span> €/Dom.</span>
  <span class="stat" id="hGoal">🎯 300 €</span>
  <span id="inv">
    <span id="iSeed">🌱0</span><span id="iBio">🌟0</span><span id="iPest">🧪0</span><span id="iFert">💩0</span>
  </span>
  <span class="spacer"></span>
  <button id="btnHelp" title="Hilfe">❓</button>
  <button id="btnPause" title="Pause">⏸️</button>

</div>

<div id="queuebar"></div>

<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="toasts"></div>
  <div id="amenu" class="hidden"></div>
  <div id="modal" class="hidden"><div id="mbox"></div></div>
  <div id="loading">🌳<br>Dominiks werden gepflanzt …</div>
</div>

<script>
'use strict';
/* =====================================================================
   ErnteDominiksFest — ein satirisches Baum-Farming-Spiel
   ===================================================================== */

// ---------------------------------------------------------------- utils
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const rnd   = (a,b)=>a+Math.random()*(b-a);
const rndi  = (a,b)=>Math.floor(rnd(a,b+1));
const pick  = arr=>arr[Math.floor(Math.random()*arr.length)];
function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

// ---------------------------------------------------------------- audio
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq,dur,type='sine',vol=0.12,when=0){
  const c=ac(); if(!c) return;
  if(c.state==='suspended') c.resume();
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(vol,c.currentTime+when);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+when+dur);
  o.connect(g).connect(c.destination);
  o.start(c.currentTime+when); o.stop(c.currentTime+when+dur+0.02);
}
const SND={
  tap:  ()=>tone(620,0.05,'square',0.05),
  enq:  ()=>tone(880,0.07,'triangle',0.09),
  done: ()=>{tone(523,0.08,'triangle',0.09);tone(784,0.1,'triangle',0.09,0.07);},
  coin: ()=>{tone(988,0.07,'square',0.07);tone(1319,0.12,'square',0.07,0.06);},
  alarm:()=>{tone(220,0.18,'sawtooth',0.1);tone(165,0.25,'sawtooth',0.1,0.15);},
  fail: ()=>tone(160,0.16,'square',0.08),
  splat:()=>tone(85,0.22,'sine',0.16),
};

// ---------------------------------------------------------------- Konstanten
const W=800, H=1100;                       // logische Weltgröße
const PLOT_COLS=[150,400,650];
const PLOT_ROWS=[235,395,555,715];
const WELL ={x:105,y:912}, STALL={x:662,y:905}, SHED={x:398,y:922};
const IDLE=[{x:235,y:1030},{x:400,y:1042},{x:565,y:1030}];
const DAYLEN=75;                           // Sekunden pro Tag
const MAXDAY=10, GOAL=300;
const SEED_PRICE=5, BIO_PRICE=14;
const STAGE_DUR={seed:8,sprout:14,young:18,mature:12,blossom:10};
const STAGE_NEXT={seed:'sprout',sprout:'young',young:'mature',mature:'blossom',blossom:'fruiting'};
const FRUIT_WINDOW=30, OVERRIPE_WINDOW=15, WILT_LIMIT=12;
const GROWABLE=['seed','sprout','young','mature','blossom'];
const ALIVE=['seed','sprout','young','mature','blossom','fruiting','overripe'];

const TASKDEFS={
  plant:   {icon:'🌱', label:'Pflanzen',      dur:2.5},
  plantbio:{icon:'🌟', label:'Bio pflanzen',  dur:2.5},
  water:   {icon:'💧', label:'Gießen',        dur:1.8},
  trim:    {icon:'✂️', label:'Schneiden',     dur:3.4},
  spray:   {icon:'🧪', label:'Spritzen',      dur:2.2},
  fert:    {icon:'💩', label:'Düngen',        dur:2.0},
  harvest: {icon:'🧺', label:'Ernten',        dur:3.0},
  refill:  {icon:'🚰', label:'Kanne füllen',  dur:2.0},
  sell:    {icon:'💰', label:'Verkaufen',     dur:1.5},
};

// ---------------------------------------------------------------- Spielzustand
const state={ t:0, day:1, dayT:0, price:12, priceT:0, money:25,
  paused:true, over:false, won:false, totalEarned:0, totalHarvested:0, checkT:0 };
const inv={ seed:2, bio:0, pest:1, fert:0 };
const upg={ can:0, shears:0, barrow:0, plots:0 };

const plots=[];
for(let r=0;r<4;r++) for(let c=0;c<3;c++){
  plots.push({ x:PLOT_COLS[c], y:PLOT_ROWS[r], unlocked:r<3,
    stage:'empty', growth:0, t:0, water:1, wilt:0, over:0, pest:null,
    fruits:0, premium:false, seed:r*3+c+7 });
}

const chars=[
  {key:'manni', name:'Manni', color:'#ff6b4a', speed:175, carryBase:4, canBase:4, work:1.0,
   flavor:'Flink wie ein Wiesel, trägt aber nix.'},
  {key:'jannes',name:'Jannes',color:'#4ab0ff', speed:135, carryBase:5, canBase:7, work:0.72,
   flavor:'Arbeitet effizient. Behauptet er zumindest.'},
  {key:'benni', name:'Benni', color:'#57e06b', speed:105, carryBase:9, canBase:4, work:1.0,
   flavor:'Stark wie ein Baum, schnell wie ein Baum.'},
];
chars.forEach((c,i)=>{ Object.assign(c,{ idx:i, x:IDLE[i].x, y:IDLE[i].y, dir:1,
  queue:[], phase:'idle', prog:0, dur:1, carry:0, can:c.canBase, bobT:0 }); });
const canCap  = c=>c.canBase + upg.can*2;
const carryCap= c=>c.carryBase + upg.barrow*3;
const trimMul = ()=>[1,0.7,0.5][upg.shears];

let selChar=-1;
let queueVersion=0, renderedQueueVersion=-1;
const floats=[];   // {x,y,txt,t,color,size}

// ---------------------------------------------------------------- assets
const IMG={};
const SPRITES={};   // vorgerenderte, verkleinerte Charaktere
let dominikSmall=null;
function loadAssets(){
  const names=['manni','jannes','benni','dominik'];
  return Promise.all(names.map(n=>new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>{IMG[n]=im;res();};
    im.onerror=()=>rej(new Error('Bild fehlt: '+n+'.png'));
    im.src=n+'.png';
  })));
}
function prepSprites(){
  for(const c of chars){
    const im=IMG[c.key], h=260, w=Math.round(h*im.width/im.height);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(im,0,0,w,h);
    SPRITES[c.key]=cv;
  }
  const dim=IMG.dominik, dh=96, dw=Math.round(dh*dim.width/dim.height);
  dominikSmall=document.createElement('canvas'); dominikSmall.width=dw; dominikSmall.height=dh;
  dominikSmall.getContext('2d').drawImage(dim,0,0,dw,dh);
}
function drawPortrait(cv,key){
  const im=IMG[key], ctx=cv.getContext('2d');
  const side=im.width*0.42, sx=im.width*0.29, sy=im.height*0.03;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(im,sx,sy,side,side,0,0,cv.width,cv.height);
}

// ---------------------------------------------------------------- Canvas & Layout
const cvEl=document.getElementById('cv');
const ctx=cvEl.getContext('2d');
let scale=1, offX=0, offY=0, dpr=1;
function resize(){
  const wrap=document.getElementById('wrap');
  const cw=wrap.clientWidth, ch=wrap.clientHeight;
  dpr=window.devicePixelRatio||1;
  cvEl.width=Math.round(cw*dpr); cvEl.height=Math.round(ch*dpr);
  scale=Math.min(cw/W, ch/H);
  offX=(cw-W*scale)/2; offY=(ch-H*scale)/2;
}
window.addEventListener('resize',resize);
const worldToScreen=(x,y)=>({x:offX+x*scale, y:offY+y*scale});
const screenToWorld=(x,y)=>({x:(x-offX)/scale, y:(y-offY)/scale});

// ---------------------------------------------------------------- toasts & floats
function toast(msg,type='',ms=3200){
  const box=document.getElementById('toasts');
  while(box.children.length>=4) box.firstChild.remove();
  const d=document.createElement('div');
  d.className='toast '+type; d.textContent=msg;
  box.appendChild(d);
  setTimeout(()=>{d.classList.add('out'); setTimeout(()=>d.remove(),450);},ms);
}
function addFloat(x,y,txt,color='#fff',size=18){ floats.push({x,y,txt,t:0,color,size}); }

// ---------------------------------------------------------------- Bäume
function plantAt(p,premium){
  Object.assign(p,{stage:'seed',growth:0,t:0,water:1,wilt:0,over:0,pest:null,fruits:0,premium});
}
function killTree(p,msg){
  const n=plots.indexOf(p)+1;
  Object.assign(p,{stage:'dead',growth:0,fruits:0,pest:null});
  toast(msg.replace('#',`#${n}`),'bad'); SND.splat();
}
function updateTree(p,dt){
  if(!p.unlocked||p.stage==='empty'||p.stage==='dead') return;
  const dayF=1+0.12*(state.day-1);
  // Wasser
  const drink=(p.stage==='seed'||p.stage==='sprout')?1/80:1/55;
  p.water=clamp(p.water - dt*drink*dayF*(p.premium?1.2:1),0,1);
  if(p.water<=0){
    p.wilt+=dt;
    if(p.wilt>=WILT_LIMIT){ killTree(p,'💀 Baum # ist vertrocknet! Gießen hilft, nur so als Tipp.'); return; }
  } else p.wilt=0;
  // Schädlinge
  if(p.pest){
    p.pest.ttl-=dt;
    if(p.pest.ttl<=0){ killTree(p,'🪲 Die Blattläuse haben Baum # dahingerafft!'); return; }
  }
  // Wildwuchs
  if(['young','mature','blossom','fruiting','overripe'].includes(p.stage))
    p.over=clamp(p.over+dt/60,0,1);
  // Wachstum
  if(GROWABLE.includes(p.stage) && p.water>0 && !p.pest){
    let rate=1/STAGE_DUR[p.stage];
    if(p.premium) rate*=1.35;
    if(p.over>0.6) rate*=0.6;
    p.growth+=dt*rate;
    if(p.growth>=1){
      const next=STAGE_NEXT[p.stage];
      p.stage=next; p.growth=0; p.t=0;
      if(next==='fruiting'){
        p.fruits=clamp(rndi(2,4)+(p.premium?1:0)-(p.over>0.6?1:0),1,5);
        toast(pick(['🍑 Dominik ist reif an Baum #N!','🍑 Baum #N trägt prächtige Dominiks!','🍑 Erntezeit an Baum #N!']).replace('#N','#'+(plots.indexOf(p)+1)),'good');
        SND.done();
      }
    }
  }
  // Früchte reifen über
  if(p.stage==='fruiting'){
    p.t+=dt;
    if(p.t>=FRUIT_WINDOW){ p.stage='overripe'; p.t=0;
      toast('🫠 Die Dominiks an Baum #'+(plots.indexOf(p)+1)+' werden matschig! Schnell ernten!','warn'); }
  } else if(p.stage==='overripe'){
    p.t+=dt;
    if(p.t>=OVERRIPE_WINDOW){
      p.stage='mature'; p.growth=0.2; p.fruits=0; p.t=0;
      toast('💦 Platsch. Die Dominiks an Baum #'+(plots.indexOf(p)+1)+' sind zu Matsch zerfallen.','bad');
      SND.splat();
    }
  }
}
function spawnPests(dt){
  if(state.day<2) return;
  const active=plots.filter(p=>p.pest).length;
  const cap=Math.min(3,Math.ceil(state.day/3));
  if(active>=cap) return;
  for(const p of plots){
    if(!p.unlocked||p.pest) continue;
    if(!['young','mature','blossom','fruiting','overripe'].includes(p.stage)) continue;
    if(Math.random()<dt*(0.002+0.0012*state.day)){
      p.pest={ttl:Math.max(12,24-state.day), max:Math.max(12,24-state.day)};
      toast('🪲 Blattläuse befallen Baum #'+(plots.indexOf(p)+1)+'! Pestizid, zackig!','bad',4200);
      SND.alarm();
      return;
    }
  }
}

// ---------------------------------------------------------------- Aufgaben
function targetFor(task){
  if(task.plot!=null){ const p=plots[task.plot]; return {x:p.x, y:p.y+58}; }
  if(task.type==='refill') return {x:WELL.x+8, y:WELL.y+42};
  if(task.type==='sell')   return {x:STALL.x-6, y:STALL.y+46};
  return IDLE[0];
}
function enqueue(ci,type,plotIdx=null,silent=false){
  const c=chars[ci];
  if(c.queue.length>=6){ toast(c.name+' hat schon genug auf dem Zettel! (max. 6)','warn'); SND.fail(); return false; }
  c.queue.push({type,plot:plotIdx});
  queueVersion++;
  if(!silent) SND.enq();
  return true;
}
function cancelTask(ci,qi){
  const c=chars[ci];
  if(qi<0||qi>=c.queue.length) return;
  const t=c.queue[qi];
  c.queue.splice(qi,1);
  if(qi===0){ c.phase='idle'; c.prog=0; }
  queueVersion++;
  toast('❌ '+c.name+': „'+TASKDEFS[t.type].label+'" abgebrochen.','',1800);
  SND.tap();
}
// Prüfung bei Ankunft — Welt kann sich geändert haben
function canDoNow(c,task){
  const p=task.plot!=null?plots[task.plot]:null;
  switch(task.type){
    case 'plant':    if(!(p.stage==='empty'||p.stage==='dead')) return 'Da wächst schon was!';
                     if(inv.seed<1) return 'Keine Samen mehr!'; return true;
    case 'plantbio': if(!(p.stage==='empty'||p.stage==='dead')) return 'Da wächst schon was!';
                     if(inv.bio<1) return 'Keine Bio-Samen mehr!'; return true;
    case 'water':    if(!ALIVE.includes(p.stage)) return 'Hier gibt es nichts zu gießen.';
                     if(c.can<1) return c.name+'s Gießkanne ist leer!'; return true;
    case 'trim':     if(!ALIVE.includes(p.stage)||p.over<0.15) return 'Nichts zu schneiden.'; return true;
    case 'spray':    if(!p.pest) return 'Keine Schädlinge (mehr) da.';
                     if(inv.pest<1) return 'Kein Pestizid im Lager!'; return true;
    case 'fert':     if(!GROWABLE.includes(p.stage)) return 'Düngen bringt hier nichts.';
                     if(inv.fert<1) return 'Kein Dünger im Lager!'; return true;
    case 'harvest':  if(!(p.stage==='fruiting'||p.stage==='overripe')) return 'Keine reifen Dominiks.';
                     if(c.carry>=carryCap(c)) return c.name+' kann nichts mehr tragen!'; return true;
    case 'refill':   if(c.can>=canCap(c)) return 'Kanne ist schon voll.'; return true;
    case 'sell':     if(c.carry<1) return c.name+' hat nichts zu verkaufen.'; return true;
  }
  return true;
}
function completeTask(c,task){
  const p=task.plot!=null?plots[task.plot]:null;
  const head={x:c.x,y:c.y-150};
  switch(task.type){
    case 'plant':    inv.seed--; plantAt(p,false); addFloat(p.x,p.y-60,'🌱'); break;
    case 'plantbio': inv.bio--;  plantAt(p,true);  addFloat(p.x,p.y-60,'🌟'); break;
    case 'water':    p.water=1; p.wilt=0; c.can--; addFloat(p.x,p.y-80,'💧','#7cc7ff'); break;
    case 'trim':     p.over=0; addFloat(p.x,p.y-90,'✂️'); break;
    case 'spray':    inv.pest--; p.pest=null; addFloat(p.x,p.y-90,'🪲✖','#ffb0b0'); break;
    case 'fert':     inv.fert--; p.growth=clamp(p.growth+0.45,0,0.99); p.water=clamp(p.water-0.15,0.05,1);
                     addFloat(p.x,p.y-80,'💩'); break;
    case 'harvest': {
      const space=carryCap(c)-c.carry;
      let avail=p.stage==='overripe'?Math.max(1,Math.ceil(p.fruits/2)):p.fruits;
      const take=Math.min(avail,space);
      c.carry+=take; state.totalHarvested+=take;
      addFloat(head.x,head.y,'+'+take+' Dominik'+(take>1?'s':''),'#ffd76a');
      if(p.stage==='overripe'){ p.stage='mature'; p.growth=0.2; p.fruits=0; p.t=0; }
      else { p.fruits-=take; if(p.fruits<=0){ p.stage='mature'; p.growth=0.2; p.t=0; } }
      break;
    }
    case 'refill':   c.can=canCap(c); addFloat(WELL.x,WELL.y-90,'💧💧','#7cc7ff'); break;
    case 'sell': {
      const sum=Math.round(c.carry*state.price);
      state.money+=sum; state.totalEarned+=sum;
      addFloat(STALL.x,STALL.y-110,'+'+sum+' €','#ffd76a',22);
      toast(pick(['💰 '+c.carry+' Dominiks verkauft! Das Fest jubelt.',
                  '💰 Frische Dominiks! Gehen weg wie warme Semmeln.',
                  '💰 Die Dominik-Börse dankt.'] ),'good',2200);
      c.carry=0; SND.coin(); updateHUD();
      break;
    }
  }
  if(task.type!=='sell') SND.done();
  updateHUD();
}
function updateChar(c,dt){
  if(c.queue.length===0){ c.phase='idle'; return; }
  const task=c.queue[0];
  if(c.phase==='idle'){ c.phase='walk'; }
  if(c.phase==='walk'){
    const tg=targetFor(task);
    const dx=tg.x-c.x, dy=tg.y-c.y, d=Math.hypot(dx,dy);
    if(d<7){
      const ok=canDoNow(c,task);
      if(ok!==true){
        addFloat(c.x,c.y-160,'❓','#ffb0b0');
        toast('🤷 '+c.name+': '+ok,'warn',2600);
        SND.fail();
        c.queue.shift(); c.phase='idle'; queueVersion++;
        return;
      }
      c.phase='work'; c.prog=0;
      c.dur=TASKDEFS[task.type].dur*c.work*(task.type==='trim'?trimMul():1);
    } else {
      const sp=c.speed*dt;
      c.x+=dx/d*Math.min(sp,d); c.y+=dy/d*Math.min(sp,d);
      if(Math.abs(dx)>2) c.dir=dx>0?1:-1;
      c.bobT+=dt;
    }
  } else if(c.phase==='work'){
    c.prog+=dt;
    if(c.prog>=c.dur){
      const ok=canDoNow(c,task);   // z. B. Frucht inzwischen zermatscht
      if(ok===true) completeTask(c,task);
      else { addFloat(c.x,c.y-160,'❓','#ffb0b0'); SND.fail(); }
      c.queue.shift(); c.phase='idle'; c.prog=0; queueVersion++;
    }
  }
}

// ---------------------------------------------------------------- gültige Aktionen
function plotActions(p){
  const acts=[];
  if(!p.unlocked) return acts;
  if(p.stage==='empty'||p.stage==='dead'){
    acts.push({type:'plant',  cnt:inv.seed, dis:inv.seed<1});
    acts.push({type:'plantbio',cnt:inv.bio, dis:inv.bio<1});
    return acts;
  }
  if(ALIVE.includes(p.stage)){
    if(p.water<0.95) acts.push({type:'water'});
    if(p.over>=0.15) acts.push({type:'trim'});
    if(p.pest)       acts.push({type:'spray', cnt:inv.pest, dis:inv.pest<1});
    if(GROWABLE.includes(p.stage)) acts.push({type:'fert', cnt:inv.fert, dis:inv.fert<1});
    if(p.stage==='fruiting'||p.stage==='overripe') acts.push({type:'harvest'});
  }
  return acts;
}

function tapWorld(wx,wy){
  if(state.over) return;
  // Charaktere zuerst
  for(const c of chars){
    if(Math.abs(wx-c.x)<45 && wy<c.y+18 && wy>c.y-160){
      selChar=(selChar===c.idx)?-1:c.idx;
      SND.tap(); queueVersion++;
      if(selChar>=0) toast('👉 '+c.name+' ausgewählt. Tippe Bäume & Stationen an!','',1600);
      return;
    }
  }
  // Läden / Stationen
  const near=(s,r)=>Math.hypot(wx-s.x,wy-(s.y-30))<r;
  if(near(SHED,70)){ openShop(); return; }
  if(selChar<0){
    if(near(WELL,70)||near(STALL,80)||plots.some(p=>Math.hypot(wx-p.x,wy-(p.y-40))<70))
      toast('☝️ Wähle zuerst Manni, Jannes oder Benni aus!','warn',2200);
    return;
  }
  if(near(WELL,70)){ enqueue(selChar,'refill'); return; }
  if(near(STALL,80)){ enqueue(selChar,'sell'); return; }
  for(let i=0;i<plots.length;i++){
    const p=plots[i];
    if(Math.hypot(wx-p.x,wy-(p.y-40))<70){
      if(!p.unlocked){ toast('🚧 Diese Parzelle kannst du im Laden kaufen!','warn'); return; }
      openMenuForPlot(i);
      return;
    }
  }
}
cvEl.addEventListener('pointerdown',e=>{

  const r=cvEl.getBoundingClientRect();
  const w=screenToWorld(e.clientX-r.left,e.clientY-r.top);
  tapWorld(w.x,w.y);
});

// ---------------------------------------------------------------- Rendering
const grassPatches=(()=>{const r=mulberry(42),a=[];
  for(let i=0;i<26;i++)a.push({x:r()*W,y:120+r()*(H-160),rx:20+r()*45,ry:8+r()*16,c:r()});
  return a;})();
const flowers=(()=>{const r=mulberry(7),a=[];
  for(let i=0;i<40;i++)a.push({x:r()*W,y:130+r()*(H-170),h:r()});
  return a;})();
function rr(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawGround(){
  // ganze Leinwand mit Gras (auch Letterbox-Bereiche)
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  const g=ctx.createLinearGradient(0,0,0,cvEl.height/dpr);
  g.addColorStop(0,'#6cb14e'); g.addColorStop(1,'#4f9140');
  ctx.fillStyle=g; ctx.fillRect(0,0,cvEl.width/dpr,cvEl.height/dpr);
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.06)';
  for(const p of grassPatches){ ctx.beginPath(); ctx.ellipse(p.x,p.y,p.rx,p.ry,0,0,7); ctx.fill(); }
  for(const f of flowers){
    ctx.fillStyle=f.h>0.5?'#ffe08a':'#ff9db0';
    ctx.beginPath(); ctx.arc(f.x,f.y,2.6,0,7); ctx.fill();
  }
  // Zaun oben
  ctx.strokeStyle='#7a5a34'; ctx.lineWidth=5; ctx.lineCap='round';
  for(let x=30;x<W;x+=70){ ctx.beginPath(); ctx.moveTo(x,95); ctx.lineTo(x,135); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(10,105); ctx.lineTo(W-10,105); ctx.moveTo(10,125); ctx.lineTo(W-10,125); ctx.stroke();
  // Banner
  ctx.fillStyle='#c8352f'; rr(W/2-180,52,360,34,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 21px system-ui'; ctx.textAlign='center';
  ctx.fillText('🎪 ErnteDominiksFest 🎪',W/2,76);
}
function drawWell(){
  const {x,y}=WELL;
  ctx.fillStyle='#8b8b8b'; ctx.beginPath(); ctx.ellipse(x,y,42,18,0,0,7); ctx.fill();
  ctx.fillStyle='#6d6d6d'; ctx.beginPath(); ctx.ellipse(x,y-4,36,14,0,0,7); ctx.fill();
  ctx.fillStyle='#3f7fbf'; ctx.beginPath(); ctx.ellipse(x,y-4,28,10,0,0,7); ctx.fill();
  ctx.strokeStyle='#7a5a34'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-30,y-8); ctx.lineTo(x-30,y-70); ctx.moveTo(x+30,y-8); ctx.lineTo(x+30,y-70); ctx.stroke();
  ctx.fillStyle='#a34d2d'; ctx.beginPath();
  ctx.moveTo(x-46,y-66); ctx.lineTo(x,y-96); ctx.lineTo(x+46,y-66); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 15px system-ui'; ctx.textAlign='center';
  ctx.fillText('🚰 Brunnen',x,y-106);
}
function drawStall(){
  const {x,y}=STALL;
  ctx.fillStyle='#7a5a34'; rr(x-62,y-42,124,42,6); ctx.fill();
  ctx.fillStyle='#93704a'; rr(x-62,y-42,124,10,4); ctx.fill();
  ctx.strokeStyle='#7a5a34'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-58,y-42); ctx.lineTo(x-58,y-100); ctx.moveTo(x+58,y-42); ctx.lineTo(x+58,y-100); ctx.stroke();
  for(let i=0;i<6;i++){ ctx.fillStyle=i%2?'#e8e4d8':'#c8352f';
    ctx.fillRect(x-72+i*24,y-116,24,20); }
  ctx.fillStyle='rgba(0,0,0,.15)'; ctx.fillRect(x-72,y-98,144,4);
  if(dominikSmall){ const dw=dominikSmall.width*(30/dominikSmall.height);
    ctx.drawImage(dominikSmall,x-40,y-70,dw,30);
    ctx.drawImage(dominikSmall,x-40+dw+4,y-70,dw,30); }
  ctx.fillStyle='#fff'; ctx.font='bold 15px system-ui'; ctx.textAlign='center';
  ctx.fillText('💰 Feststand',x,y-126);
}
function drawShed(){
  const {x,y}=SHED;
  ctx.fillStyle='#6e4f2f'; rr(x-48,y-70,96,70,6); ctx.fill();
  ctx.fillStyle='#5b3f24'; rr(x-16,y-46,32,46,4); ctx.fill();
  ctx.fillStyle='#a34d2d'; ctx.beginPath();
  ctx.moveTo(x-58,y-66); ctx.lineTo(x,y-100); ctx.lineTo(x+58,y-66); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 15px system-ui'; ctx.textAlign='center';
  ctx.fillText('🛒 Laden',x,y-110);
}
function fruitSlots(p){
  const r=mulberry(p.seed), n=5, out=[];
  for(let i=0;i<n;i++){
    const ang=-0.15-Math.PI*0.7*(i/(n-1))-r()*0.25+ (i%2?0.15:0);
    const rad=26+r()*16;
    out.push({dx:Math.cos(ang+Math.PI*-0.0)*rad*1.15, dy:Math.sin(ang)*rad-14+r()*10});
  }
  return out;
}
function drawTree(p,pi){
  const {x,y}=p;
  // Beet
  ctx.fillStyle='#8d6e42'; ctx.beginPath(); ctx.ellipse(x,y,56,20,0,0,7); ctx.fill();
  ctx.fillStyle='#7a5c34'; ctx.beginPath(); ctx.ellipse(x,y,56,20,0,0,7); ctx.lineWidth=3; ctx.strokeStyle='#6b4f2c'; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='bold 12px system-ui'; ctx.textAlign='center';
  ctx.fillText('#'+(pi+1),x+42,y+16);
  if(!p.unlocked){
    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.setLineDash([8,7]); ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(x,y-30,60,52,0,0,7); ctx.stroke(); ctx.setLineDash([]);
    ctx.font='26px system-ui'; ctx.fillText('🚧',x,y-30);
    ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font='bold 12px system-ui';
    ctx.fillText('Zu verkaufen',x,y-2);
    return;
  }
  if(p.stage==='empty') return;
  if(p.stage==='dead'){
    ctx.strokeStyle='#6e625a'; ctx.lineWidth=9; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-58); ctx.stroke();
    ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(x,y-40); ctx.lineTo(x-22,y-62); ctx.moveTo(x,y-52); ctx.lineTo(x+20,y-72); ctx.stroke();
    ctx.font='16px system-ui'; ctx.textAlign='center'; ctx.fillText('💀',x,y-84);
    return;
  }
  const dry=1-clamp(p.water*3,0,1);            // erst unter 33 % sichtbar
  const wiltF=clamp(p.wilt/WILT_LIMIT,0,1);
  const droop=wiltF*8+dry*3;
  const leaf=(l)=>{ // Grün, ausgedörrt Richtung oliv/braun
    const r1=Math.round(lerp(63,138,Math.max(dry*0.7,wiltF)));
    const g1=Math.round(lerp(150,120,Math.max(dry*0.7,wiltF)));
    const b1=Math.round(lerp(70,52,Math.max(dry*0.7,wiltF)));
    return `rgb(${r1+l},${g1+l},${b1})`;
  };
  const overScale=1+p.over*0.3;
  if(p.stage==='seed'){
    ctx.fillStyle='#6b4f2c'; ctx.beginPath(); ctx.ellipse(x,y-4,14,7,0,0,7); ctx.fill();
    if(p.growth>0.5){ ctx.strokeStyle='#4c9b52'; ctx.lineWidth=4; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x,y-6); ctx.lineTo(x,y-16); ctx.stroke(); }
  } else if(p.stage==='sprout'){
    ctx.strokeStyle='#5d8c3e'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-26+droop*0.5); ctx.stroke();
    ctx.fillStyle=leaf(0); ctx.beginPath(); ctx.arc(x-8,y-28+droop,9,0,7); ctx.arc(x+8,y-30+droop,9,0,7); ctx.fill();
  } else {
    const big=p.stage!=='young';
    const th=big?58:38, tw=big?13:9, cr=(big?40:26)*overScale, cy=y-th-(big?22:12)+droop;
    ctx.fillStyle='#7a5a34'; rr(x-tw/2,y-th,tw,th,4); ctx.fill();
    ctx.fillStyle=leaf(-12); ctx.beginPath(); ctx.arc(x-cr*0.55,cy+8,cr*0.72,0,7); ctx.arc(x+cr*0.55,cy+8,cr*0.72,0,7); ctx.fill();
    ctx.fillStyle=leaf(0); ctx.beginPath(); ctx.arc(x,cy-6,cr,0,7); ctx.fill();
    ctx.fillStyle=leaf(14); ctx.beginPath(); ctx.arc(x-cr*0.3,cy-cr*0.45,cr*0.5,0,7); ctx.fill();
    if(p.over>0.5){ // wilde Triebe
      ctx.strokeStyle=leaf(-18); ctx.lineWidth=4; ctx.lineCap='round';
      const r=mulberry(p.seed*3);
      for(let i=0;i<5;i++){ const a=r()*Math.PI*2;
        ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*cr*0.8,cy+Math.sin(a)*cr*0.8);
        ctx.lineTo(x+Math.cos(a)*(cr*0.8+16+p.over*14),cy+Math.sin(a)*(cr*0.8+16+p.over*14)); ctx.stroke(); }
    }
    if(p.stage==='blossom'){
      const r=mulberry(p.seed*5);
      ctx.fillStyle='#fff0f4';
      for(let i=0;i<8;i++){ ctx.beginPath();
        ctx.arc(x+(r()-0.5)*cr*1.7, cy+(r()-0.5)*cr*1.4, 4.5,0,7); ctx.fill(); }
    }
    if((p.stage==='fruiting'||p.stage==='overripe') && dominikSmall){
      const slots=fruitSlots(p);
      const fh=30, fw=dominikSmall.width*(fh/dominikSmall.height);
      for(let i=0;i<p.fruits;i++){
        const s=slots[i%slots.length];
        const wob=Math.sin(state.t*2.1+i*1.7)*0.09;
        ctx.save();
        ctx.translate(x+s.dx, cy+s.dy+10);
        ctx.rotate(wob);
        ctx.drawImage(dominikSmall,-fw/2,-4,fw,fh);
        if(p.stage==='overripe'){
          ctx.fillStyle='rgba(200,110,20,.4)';
          ctx.beginPath(); ctx.ellipse(0,fh/2-4,fw/2,fh/2,0,0,7); ctx.fill();
        }
        ctx.restore();
      }
      if(p.stage==='overripe'){ // Fliegen
        ctx.fillStyle='#222';
        for(let i=0;i<4;i++){ const a=state.t*3+i*1.9;
          ctx.beginPath(); ctx.arc(x+Math.cos(a)*(cr+12), cy+Math.sin(a*1.3)*14-8, 2.2,0,7); ctx.fill(); }
      }
    }
    if(p.pest){ // krabbelnde Läuse
      ctx.fillStyle='#902020';
      const r=mulberry(p.seed*9);
      for(let i=0;i<5;i++){
        const a=r()*6.28+state.t*(0.6+r());
        ctx.beginPath(); ctx.arc(x+Math.cos(a)*cr*0.75, cy+Math.sin(a)*cr*0.6, 3.4,0,7); ctx.fill();
      }
    }
  }
  // Statussymbole über dem Baum
  let iy=y-135; const icons=[];
  if(p.pest) icons.push({t:'🪲',ring:p.pest.ttl/p.pest.max,c:'#ff5c5c'});
  if(p.water<0.35 && ALIVE.includes(p.stage)) icons.push({t:'💧',blink:true,c:'#7cc7ff'});
  if(p.over>0.6) icons.push({t:'✂️',c:'#ffd76a'});
  if(p.stage==='fruiting') icons.push({t:'🧺',ring:1-p.t/FRUIT_WINDOW,c:'#7dff8a'});
  if(p.stage==='overripe') icons.push({t:'⏳',ring:1-p.t/OVERRIPE_WINDOW,c:'#ff9d3c',blink:true});
  let ix=x-(icons.length-1)*17;
  for(const ic of icons){
    if(ic.blink && Math.floor(state.t*3)%2===0){ ix+=34; continue; }
    ctx.fillStyle='rgba(20,35,20,.75)'; ctx.beginPath(); ctx.arc(ix,iy,14,0,7); ctx.fill();
    if(ic.ring!=null){ ctx.strokeStyle=ic.c; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(ix,iy,14,-Math.PI/2,-Math.PI/2+6.28*clamp(ic.ring,0,1)); ctx.stroke(); }
    ctx.font='14px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(ic.t,ix,iy+1); ctx.textBaseline='alphabetic';
    ix+=34;
  }
  // Ziel-Marker: eingeplante Aufgaben anderer
  let mx=x-52;
  for(const c of chars) for(const t of c.queue) if(t.plot===pi){
    ctx.fillStyle=c.color; ctx.beginPath(); ctx.arc(mx,y+14,5,0,7); ctx.fill(); mx+=12;
  }
}
function drawChar(c){
  const spr=SPRITES[c.key]; if(!spr) return;
  const hgt=128, wid=spr.width*(hgt/spr.height);
  const bob=c.phase==='walk'?Math.sin(c.bobT*11)*3.5:(c.phase==='work'?Math.sin(state.t*16)*1.6:0);
  // Schatten
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(c.x,c.y+4,wid*0.42,9,0,0,7); ctx.fill();
  if(selChar===c.idx){
    ctx.strokeStyle=c.color; ctx.lineWidth=4;
    ctx.beginPath(); ctx.ellipse(c.x,c.y+4,wid*0.55+6,13,0,0,7); ctx.stroke();
    ctx.globalAlpha=0.25; ctx.fillStyle=c.color;
    ctx.beginPath(); ctx.ellipse(c.x,c.y+4,wid*0.55+6,13,0,0,7); ctx.fill(); ctx.globalAlpha=1;
  }
  ctx.save();
  ctx.translate(c.x,c.y+bob);
  ctx.scale(c.dir,1);
  ctx.drawImage(spr,-wid/2,-hgt,wid,hgt);
  ctx.restore();
  // Namensschild
  ctx.fillStyle='rgba(20,35,20,.8)'; rr(c.x-30,c.y-hgt-24,60,18,8); ctx.fill();
  ctx.fillStyle=c.color; ctx.font='bold 12px system-ui'; ctx.textAlign='center';
  ctx.fillText(c.name,c.x,c.y-hgt-11);
  // Trage-Anzeige
  if(c.carry>0 && dominikSmall){
    const fh=20, fw=dominikSmall.width*(fh/dominikSmall.height);
    ctx.drawImage(dominikSmall,c.x+18,c.y-hgt-20,fw,fh);
    ctx.fillStyle='#ffd76a'; ctx.font='bold 13px system-ui'; ctx.textAlign='left';
    ctx.fillText('×'+c.carry,c.x+20+fw,c.y-hgt-5);
  }
  // Arbeit: Fortschritt + Werkzeug
  if(c.phase==='work' && c.queue[0]){
    const pct=clamp(c.prog/c.dur,0,1);
    ctx.fillStyle='rgba(20,35,20,.8)'; rr(c.x-26,c.y-hgt-42,52,9,4); ctx.fill();
    ctx.fillStyle='#ffd76a'; rr(c.x-24,c.y-hgt-40,48*pct,5,2); ctx.fill();
    ctx.font='20px system-ui'; ctx.textAlign='center';
    const ty=c.y-hgt-52+Math.sin(state.t*10)*3;
    ctx.fillText(TASKDEFS[c.queue[0].type].icon,c.x,ty);
  }
}
function drawFloats(dt){
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i]; f.t+=dt;
    if(f.t>1.6){ floats.splice(i,1); continue; }
    ctx.globalAlpha=clamp(1.6-f.t,0,1);
    ctx.fillStyle=f.color; ctx.font='bold '+f.size+'px system-ui'; ctx.textAlign='center';
    ctx.fillText(f.txt,f.x,f.y-f.t*34);
    ctx.globalAlpha=1;
  }
}
function render(dt){
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*offX,dpr*offY);
  drawGround();
  for(let i=0;i<plots.length;i++) drawTree(plots[i],i);
  drawWell(); drawStall(); drawShed();
  [...chars].sort((a,b)=>a.y-b.y).forEach(drawChar);
  drawFloats(dt);
  // Abenddämmerung
  if(state.dayT>0.72){
    const a=(state.dayT-0.72)/0.28*0.24;
    ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle=`rgba(26,32,80,${a})`; ctx.fillRect(0,0,cvEl.width/dpr,cvEl.height/dpr);
    ctx.restore();
  }
}

// ---------------------------------------------------------------- Spielschleife
function update(dt){
  if(state.paused||state.over) return;
  state.t+=dt;
  state.dayT+=dt/DAYLEN;
  if(state.dayT>=1){ state.dayT=0; newDay(); }
  daybar.style.width=Math.round(state.dayT*100)+'%';
  // Preis-Random-Walk
  state.priceT+=dt;
  if(state.priceT>=2){
    state.priceT=0;
    state.price=clamp(state.price+rnd(-1,1)*(1+state.day*0.15),6,28);
    hPrice.textContent=Math.round(state.price);
  }
  spawnPests(dt);
  for(const p of plots) updateTree(p,dt);
  for(const c of chars) updateChar(c,dt);
  state.checkT+=dt;
  if(state.checkT>=1){ state.checkT=0; checkWin(); checkBankrupt(); updateHUD(); }
}
let last=performance.now();
function frame(now){
  let dt=Math.min((now-last)/1000,0.1); last=now;
  dt*=(window.__speed||1);
  update(dt);
  render(dt);
  updateQueueLive();
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- Buttons
document.getElementById('btnShop').addEventListener('click',()=>{ ac(); openShop(); });
document.getElementById('btnHelp').addEventListener('click',()=>{ ac(); showTutorial(); });
document.getElementById('btnPause').addEventListener('click',()=>{
  if(state.over) return;
  if(modal.classList.contains('hidden')){
    showModal('<h2>⏸ Pause</h2><p>Die Dominiks warten geduldig am Baum. Also … relativ geduldig.</p><div class="btnrow"><button class="primary" data-act="resume">Weiter 🚜</button></div>');
  }
});

// ---------------------------------------------------------------- Start
loadAssets().then(()=>{
  prepSprites();
  buildQueueBar();
  renderQueues();
  updateHUD();
  resize();
  document.getElementById('loading').remove();
  if(localStorage.getItem('edf_tut')) { state.paused=false; toast('🌳 Auf geht\'s! Wähle einen Arbeiter.','good'); }
  else showTutorial();
  requestAnimationFrame(frame);
}).catch(err=>{
  document.getElementById('loading').innerHTML='😢 '+err.message;
});

// Test-/Debug-Schnittstelle
window.game={ state, inv, upg, chars, plots,
  enqueue, cancelTask, tapWorld, worldToScreen, screenToWorld, openShop,
  get selChar(){return selChar;}, set selChar(v){selChar=v; queueVersion++;},
  tick(sec){ const step=0.05; for(let t=0;t<sec;t+=step) update(step); },
};
