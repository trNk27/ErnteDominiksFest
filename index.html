<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1d331d">
<link rel="icon" href="data:,">
<title>ErnteDominiksFest</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0e1a0e}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;
    user-select:none;-webkit-user-select:none;
  }
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
  button{font-family:inherit;color:inherit}

  #ui{position:absolute;inset:0;pointer-events:none;z-index:10}

  /* ---------- HUD oben ---------- */
  #hud{
    position:absolute;top:6px;left:8px;right:8px;display:flex;align-items:flex-start;gap:8px;
  }
  #stats{
    display:flex;flex-wrap:wrap;gap:3px 10px;background:rgba(12,22,12,.72);
    border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:5px 10px;
    font-size:13px;font-weight:700;backdrop-filter:blur(6px);max-width:56vw;
  }
  #daywrap{width:46px;height:6px;background:#0b160b;border-radius:3px;display:inline-block;vertical-align:middle;overflow:hidden}
  #daybar{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd76a,#ff9d3c)}
  #topbtns{margin-left:auto;display:flex;gap:6px;pointer-events:auto}
  #topbtns button{
    background:rgba(12,22,12,.72);border:1px solid rgba(255,255,255,.16);border-radius:11px;
    width:40px;height:40px;font-size:17px;cursor:pointer;backdrop-filter:blur(6px);
  }
  #topbtns button:active{transform:scale(.92)}

  /* ---------- Fadenkreuz ---------- */
  #cross{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:22px;height:22px;opacity:.85;transition:opacity .15s,transform .15s
  }
  #cross i{position:absolute;background:#fff;border-radius:2px;box-shadow:0 0 3px rgba(0,0,0,.7)}
  #cross i:nth-child(1){left:50%;top:0;width:2px;height:7px;margin-left:-1px}
  #cross i:nth-child(2){left:50%;bottom:0;width:2px;height:7px;margin-left:-1px}
  #cross i:nth-child(3){top:50%;left:0;height:2px;width:7px;margin-top:-1px}
  #cross i:nth-child(4){top:50%;right:0;height:2px;width:7px;margin-top:-1px}
  #cross.hot{transform:translate(-50%,-50%) scale(1.35);opacity:1}
  #cross.hot i{background:#ffd76a}

  /* ---------- Zielanzeige + Aktionen ---------- */
  #target{
    position:absolute;right:10px;bottom:12px;
    width:min(46vw,270px);display:flex;flex-direction:column;align-items:stretch;gap:5px;
    pointer-events:auto
  }
  #target.hidden{display:none}
  #tname{
    background:rgba(12,22,12,.8);border:1px solid rgba(255,255,255,.16);border-radius:10px;
    padding:4px 9px;font-size:12.5px;font-weight:800;text-align:center;backdrop-filter:blur(6px)
  }
  #tname small{display:block;font-size:10.5px;font-weight:600;opacity:.85;margin-top:1px}
  .act{
    position:relative;display:flex;align-items:center;gap:8px;overflow:hidden;
    background:rgba(30,58,30,.9);border:1px solid rgba(255,255,255,.2);border-radius:12px;
    padding:9px 11px;font-size:14px;font-weight:800;cursor:pointer;text-align:left;
    backdrop-filter:blur(6px);
  }
  .act .ic{font-size:17px;flex:0 0 auto;position:relative}
  .act .tx{position:relative;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act .sub{position:relative;font-size:10.5px;font-weight:700;opacity:.75;flex:0 0 auto}
  .act .prog{position:absolute;inset:0 auto 0 0;width:0;background:rgba(255,215,106,.4)}
  .act:active{transform:scale(.97)}
  .act.off{opacity:.5}
  .act.key::after{
    content:attr(data-key);position:absolute;right:5px;top:3px;font-size:8.5px;opacity:.55;font-weight:700
  }
  .act.prim{background:rgba(176,114,42,.92)}

  /* ---------- Herzen & Waffe ---------- */
  #vitals{
    position:absolute;left:10px;bottom:58px;
    display:flex;flex-direction:column;gap:4px;align-items:flex-start
  }
  #hearts{font-size:13px;letter-spacing:-1px;text-shadow:0 1px 3px #000;line-height:1}
  #weapon{
    display:flex;align-items:center;gap:5px;background:rgba(12,22,12,.72);
    border:1px solid rgba(255,255,255,.16);border-radius:9px;padding:3px 8px;
    font-size:16px;font-weight:800;backdrop-filter:blur(6px)
  }
  #weapon span{font-size:11px;font-weight:700;opacity:.85}

  /* ---------- Hotbar (Minecraft-Stil) ---------- */
  #hotbar{
    position:absolute;left:50%;bottom:8px;
    transform:translateX(calc(-50% - 74px));
    display:flex;gap:4px
  }
  #hotbar .slot{
    position:relative;width:42px;height:42px;border:2px solid rgba(255,255,255,.32);
    background:rgba(12,22,12,.66);border-radius:6px;display:flex;align-items:center;
    justify-content:center;font-size:19px;backdrop-filter:blur(4px)
  }
  #hotbar .slot.pick{cursor:pointer;pointer-events:auto}
  #hotbar .slot.pick:active{transform:scale(.93)}
  #hotbar .slot.sel{border-color:#ffd76a;background:rgba(80,64,20,.8);box-shadow:0 0 0 2px rgba(255,215,106,.28)}
  #hotbar .gap{width:9px}
  #hotbar .slot .n{
    position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:800;
    text-shadow:1px 1px 0 #000,-1px 1px 0 #000
  }
  #hotbar .slot.warn{border-color:#ff9d3c;background:rgba(70,30,10,.7)}

  /* ---------- Inventarfenster ---------- */
  #mbox .invgrid{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 2px}
  #mbox .invcell{
    width:60px;padding:5px 2px;border:1px solid rgba(255,255,255,.16);border-radius:9px;
    background:rgba(255,255,255,.05);text-align:center;font-size:9.5px;font-weight:700;
    line-height:1.25;overflow:hidden
  }
  #mbox .invcell .ic{display:block;font-size:17px;margin-bottom:1px}
  #mbox .invcell .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #mbox .invcell .n{display:block;opacity:.78;font-size:10px}
  #mbox .invcell.tap{cursor:pointer}
  #mbox .invcell.tap:active{transform:scale(.94)}
  #mbox .invcell.on{border-color:#ffd76a;background:rgba(255,215,106,.16)}
  #mbox .invcell.dim{opacity:.38}
  #mbox h3{font-size:11px;opacity:.7;margin:8px 0 0;text-transform:uppercase;letter-spacing:.5px}

  /* ---------- Aufgaben-Banner ---------- */
  #quest{
    position:absolute;left:50%;top:50px;transform:translateX(-50%);
    background:rgba(12,22,12,.82);border:1px solid #ffd76a;border-radius:12px;
    padding:5px 14px;font-size:13px;font-weight:700;text-align:center;
    backdrop-filter:blur(6px);max-width:64vw;display:none
  }
  #quest b{color:#ffd76a;margin-right:6px}
  #quest small{display:block;font-size:10.5px;opacity:.72;font-weight:600;margin-top:1px}

  /* ---------- Alarm-Pfeile ---------- */
  .alert{
    position:absolute;font-size:19px;transform:translate(-50%,-50%);
    filter:drop-shadow(0 1px 3px #000);transition:opacity .2s
  }
  .alert b{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:9px;font-weight:800}

  /* ---------- Toasts ---------- */
  #toasts{
    position:absolute;left:50%;top:100px;transform:translateX(-50%);
    display:flex;flex-direction:column;gap:4px;align-items:center;width:max-content;max-width:80vw
  }
  .toast{
    background:rgba(12,22,12,.9);border:1px solid #4a774a;border-radius:16px;
    padding:5px 13px;font-size:12.5px;font-weight:700;text-align:center;animation:ti .2s ease-out
  }
  .toast.good{border-color:#7dff8a;color:#c9ffcf}
  .toast.warn{border-color:#ffb33c;color:#ffd76a}
  .toast.bad{border-color:#ff5c5c;color:#ffb0b0}
  .toast.out{opacity:0;transition:opacity .35s}
  @keyframes ti{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* ---------- Modal ---------- */
  #modal{
    position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.66);padding:10px;pointer-events:auto
  }
  #modal.hidden{display:none}
  #mbox{
    background:#1a2e1a;border:2px solid #4a774a;border-radius:16px;padding:14px;
    width:100%;max-width:560px;max-height:94%;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.6)
  }
  #mbox h2{color:#ffd76a;font-size:19px;text-align:center;margin-bottom:7px}
  #mbox p{font-size:13px;line-height:1.5;margin-bottom:7px}
  #mbox .cols{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  @media (max-width:620px){#mbox .cols{grid-template-columns:1fr}}
  .tut li{font-size:12.5px;line-height:1.45;margin:0 0 5px 17px}
  .btnrow{
    display:flex;gap:8px;margin-top:10px;position:sticky;bottom:-14px;
    background:#1a2e1a;padding:8px 0 14px;z-index:2
  }
  .btnrow button{
    flex:1;background:#3f6b3f;border:none;border-radius:10px;padding:11px;
    font-size:15px;font-weight:800;cursor:pointer
  }
  .btnrow button.primary{background:#b0722a}
  .btnrow button:active{transform:scale(.97)}
  .shopitem{
    display:flex;align-items:center;gap:8px;background:#22401f;border:1px solid #3a5f37;
    border-radius:10px;padding:7px
  }
  .shopitem .ico{font-size:20px}
  .shopitem .txt{flex:1;min-width:0}
  .shopitem .nm{font-weight:800;font-size:13px}
  .shopitem .ds{font-size:10.5px;opacity:.8;line-height:1.3}
  .shopitem .own{font-size:10px;color:#ffd76a;font-weight:700}
  .shopitem button{
    background:#b0722a;border:none;border-radius:8px;padding:8px 9px;
    font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap
  }
  .shopitem button:disabled{background:#3b3b3b;opacity:.6}
  #shopmoney{text-align:center;font-weight:800;color:#ffd76a;margin-bottom:8px}

  /* ---------- Ladebildschirm ---------- */
  #boot{
    position:absolute;inset:0;z-index:40;background:#142614;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;font-weight:800;color:#ffd76a;font-size:17px
  }
</style>
</head>
<body>

<div id="ui">
  <div id="hud">
    <div id="stats">
      <span>\u26cf\ufe0f <b id="hMoney">0</b> \u20ac</span>
      <span>\ud83c\udf51 <b id="hSold">0</b> verkauft</span>
      <span><b id="hDay">\u2600\ufe0f 1</b> <span id="daywrap"><i id="daybar"></i></span></span>
      <span>\u26cf\ufe0f <b id="hPrice">12</b> \u20ac</span>
    </div>
    <div id="topbtns">
      <button id="btnBag" title="Inventar">\ud83c\udf92</button>
      <button id="btnPause" title="Pause">\u23f8\ufe0f</button>
    </div>
  </div>

  <div id="cross"><i></i><i></i><i></i><i></i></div>
  <div id="hurt"></div>
  <div id="vitals"><div id="hearts">\u2764\ufe0f\u2764\ufe0f\u2764\ufe0f\u2764\ufe0f\u2764\ufe0f\u2764\ufe0f\u2764\ufe0f\u2764\ufe0f\u2764\ufe0f</div><div id="weapon"></div></div>
  <div id="alerts"></div>
  <div id="quest"></div>
  <div id="toasts"></div>

  <div id="hotbar"></div>

  <div id="target" class="hidden">
    <div id="tname"></div>
    <div id="tacts"></div>
  </div>

  <div id="modal" class="hidden"><div id="mbox"></div></div>
</div>

<div id="boot">\ud83c\udf33<br>Dominik-Plantage wird angelegt \u2026</div>

<script type="module" src="./game.js"></script>
</body>
</html>
