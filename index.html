<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2e4d2e">
<link rel="icon" href="data:,">
<title>ErnteDominiksFest 🌳</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:#2e4d2e; color:#fff;
    display:flex; flex-direction:column; min-height:0;
    padding-top: env(safe-area-inset-top);
    user-select:none; -webkit-user-select:none;
  }
  button { font-family:inherit; }

  /* ---------- HUD ---------- */
  #hud {
    display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px;
    padding:6px 8px; background:#1d331d; border-bottom:2px solid #142414;
    font-size:clamp(11px,2.8vw,14px); font-weight:600; z-index:20;
  }
  #hud .title { font-weight:800; letter-spacing:.02em; color:#ffd76a; margin-right:2px; }
  #hud .stat { white-space:nowrap; }
  #daybarwrap { width:52px; height:7px; background:#0e1c0e; border-radius:4px; overflow:hidden; display:inline-block; vertical-align:middle; }
  #daybar { height:100%; width:0%; background:linear-gradient(90deg,#ffd76a,#ff9d3c); }
  #hud .spacer { flex:1; }
  #hud button {
    background:#3f6b3f; color:#fff; border:none; border-radius:8px;
    padding:5px 10px; font-size:inherit; font-weight:700; cursor:pointer;
  }
  #hud button:active { transform:scale(.95); }
  #btnShop { background:#b0722a; }
  #inv { display:flex; gap:8px; font-size:clamp(11px,2.6vw,13px); }
  #inv span.zero { opacity:.4; }

  /* ---------- Spielerstatus (Schritt 3: Kanne/Tragekapazität statt Warteschlangen-Leiste) ---------- */
  #hud .pstat { white-space:nowrap; }

  /* ---------- Canvas ----------
     Spielfläche für die Ego-Perspektive: #wrap füllt die verbleibende (Querformat-)Höhe unter
     HUD/Warteschlange, #cv füllt #wrap komplett aus. Der JS-Renderer (resize()) passt Sichtfeld/
     Horizontlinie an jede Breite/Höhe an — kein Letterboxing wie im alten Top-Down-Modus mehr. */
  #wrap { flex:1; min-height:0; position:relative; overflow:hidden; background:#8fc36a; }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  /* ---------- Toasts ---------- */
  #toasts {
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; gap:5px; align-items:center; z-index:40; pointer-events:none;
    width:max-content; max-width:92%;
  }
  .toast {
    background:rgba(20,35,20,.92); border:1px solid #4a774a; color:#fff;
    padding:6px 14px; border-radius:18px; font-size:clamp(12px,3vw,14px); font-weight:600;
    animation:tin .25s ease-out; text-align:center; max-width:100%;
  }
  .toast.warn { border-color:#ffb33c; color:#ffd76a; }
  .toast.bad { border-color:#ff5c5c; color:#ffb0b0; }
  .toast.good { border-color:#7dff8a; color:#c9ffcf; }
  @keyframes tin { from { opacity:0; transform:translateY(-8px);} to {opacity:1; transform:none;} }
  .toast.out { opacity:0; transition:opacity .4s; }

  /* ---------- Action menu ---------- */
  #amenu {
    position:absolute; z-index:35; display:flex; flex-direction:column; gap:4px;
    background:rgba(20,35,20,.96); border:2px solid #4a774a; border-radius:12px; padding:6px;
    min-width:150px; box-shadow:0 6px 18px rgba(0,0,0,.45);
  }
  #amenu.hidden { display:none; }
  #amenu .mtitle { font-size:11px; font-weight:800; opacity:.8; text-align:center; padding:0 4px 2px; }
  #amenu button {
    display:flex; align-items:center; gap:8px; background:#375c37; border:1px solid #4a774a;
    color:#fff; border-radius:8px; padding:8px 10px; font-size:14px; font-weight:700; cursor:pointer;
    text-align:left;
  }
  #amenu button:active { transform:scale(.96); }
  #amenu button .cnt { margin-left:auto; font-size:11px; opacity:.75; }
  #amenu button:disabled { opacity:.45; }

  /* ---------- Modals ---------- */
  #modal {
    position:absolute; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.6); padding:14px;
  }
  #modal.hidden { display:none; }
  #mbox {
    background:#1d331d; border:3px solid #4a774a; border-radius:16px;
    max-width:440px; width:100%; max-height:88%; overflow-y:auto; padding:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.6);
  }
  #mbox h2 { color:#ffd76a; font-size:20px; margin-bottom:8px; text-align:center; }
  #mbox p { font-size:14px; line-height:1.5; margin-bottom:8px; }
  #mbox .btnrow { display:flex; gap:8px; margin-top:12px; }
  #mbox .btnrow button {
    flex:1; background:#3f6b3f; border:none; color:#fff; font-weight:800;
    padding:10px; border-radius:10px; font-size:15px; cursor:pointer;
  }
  #mbox .btnrow button.primary { background:#b0722a; }
  #mbox .btnrow button:active { transform:scale(.97); }
  .shopitem {
    display:flex; align-items:center; gap:10px; background:#244024;
    border:1px solid #375c37; border-radius:10px; padding:8px; margin-bottom:7px;
  }
  .shopitem .ico { font-size:24px; flex:0 0 auto; }
  .shopitem .txt { flex:1; min-width:0; }
  .shopitem .nm { font-weight:800; font-size:14px; }
  .shopitem .ds { font-size:11.5px; opacity:.8; line-height:1.3; }
  .shopitem .own { font-size:11px; color:#ffd76a; }
  .shopitem button {
    flex:0 0 auto; background:#b0722a; border:none; color:#fff; font-weight:800;
    padding:8px 10px; border-radius:8px; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .shopitem button:disabled { background:#444; opacity:.6; }
  .shopitem button:active:not(:disabled) { transform:scale(.95); }
  #shopmoney { text-align:center; font-weight:800; color:#ffd76a; margin-bottom:10px; font-size:16px; }
  .tut li { font-size:13.5px; line-height:1.5; margin:0 0 7px 18px; }

  #loading {
    position:absolute; inset:0; z-index:60; background:#1d331d; display:flex;
    align-items:center; justify-content:center; flex-direction:column; gap:10px;
    font-weight:800; color:#ffd76a; font-size:18px;
  }

  /* ---------- Ego-Interaktion: Kontext-Prompt, Fortschrittsbalken, Aktions-Button ---------- */
  #actionPrompt {
    position:absolute; left:50%; top:calc(50% + 30px); transform:translateX(-50%);
    background:rgba(20,35,20,.88); border:1px solid #ffd76a; color:#ffd76a;
    padding:5px 12px; border-radius:10px; font-size:13px; font-weight:700;
    white-space:nowrap; pointer-events:none; z-index:25; text-align:center;
  }
  #actionPrompt div:last-child { font-size:11px; opacity:.85; font-weight:600; color:#fff; }
  #actionPrompt.hidden { display:none; }

  #actionBarWrap {
    position:absolute; left:50%; bottom:30px; transform:translateX(-50%);
    width:min(60vw,320px); height:9px; background:rgba(0,0,0,.45); border-radius:6px;
    border:1px solid rgba(255,255,255,.4); overflow:hidden; z-index:26;
  }
  #actionBarWrap.hidden { display:none; }
  #actionBar { height:100%; width:0%; background:linear-gradient(90deg,#ffd76a,#ff9d3c); }

  #btnInteract {
    position:absolute; right:16px; bottom:16px; z-index:30;
    width:76px; height:76px; border-radius:50%;
    background:rgba(176,114,42,.92); border:3px solid #ffd76a; color:#fff;
    font-size:11px; font-weight:800; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:2px; line-height:1.15; cursor:pointer; touch-action:none;
    box-shadow:0 4px 14px rgba(0,0,0,.45); transition:background .1s, opacity .15s;
  }
  #btnInteract .ic { font-size:22px; }
  #btnInteract.off { opacity:.4; }
  #btnInteract.active { background:rgba(255,215,106,.95); color:#1d331d; }
  #btnInteract:active { transform:translateY(1px) scale(.96); }
</style>

<div id="hud">
  <span class="title">🌳 ErnteDominiksFest</span>
  <span class="stat">💰 <span id="hMoney">0</span> €</span>
  <span class="stat">📅 Tag <span id="hDay">1</span> <span id="daybarwrap"><span id="daybar"></span></span></span>
  <span class="stat">📈 <span id="hPrice">12</span> €/Dom.</span>
  <span class="stat" id="hGoal">🎯 300 €</span>
  <span id="inv">
    <span id="iSeed">🌱0</span><span id="iBio">🌟0</span><span id="iPest">🧪0</span><span id="iFert">💩0</span>
  </span>
  <span class="pstat stat">💧 <span id="hCan">0</span>/<span id="hCanCap">0</span></span>

</div>

<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="toasts"></div>

  <div id="actionPrompt" class="hidden"></div>
  <div id="actionBarWrap" class="hidden"><div id="actionBar"></div></div>

  <div id="modal" class="hidden"><div id="mbox"></div></div>
  <div id="loading">🌳<br>Dominiks werden gepflanzt …</div>
</div>

<script>
'use strict';
/* =====================================================================
   ErnteDominiksFest — ein satirisches Baum-Farming-Spiel
   ===================================================================== */

// ---------------------------------------------------------------- utils
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const rnd   = (a,b)=>a+Math.random()*(b-a);
const rndi  = (a,b)=>Math.floor(rnd(a,b+1));
const pick  = arr=>arr[Math.floor(Math.random()*arr.length)];
function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

// ---------------------------------------------------------------- audio
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq,dur,type='sine',vol=0.12,when=0){
  const c=ac(); if(!c) return;
  if(c.state==='suspended') c.resume();
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(vol,c.currentTime+when);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+when+dur);
  o.connect(g).connect(c.destination);
  o.start(c.currentTime+when); o.stop(c.currentTime+when+dur+0.02);
}
const SND={
  tap:  ()=>tone(620,0.05,'square',0.05),
  enq:  ()=>tone(880,0.07,'triangle',0.09),
  done: ()=>{tone(523,0.08,'triangle',0.09);tone(784,0.1,'triangle',0.09,0.07);},
  coin: ()=>{tone(988,0.07,'square',0.07);tone(1319,0.12,'square',0.07,0.06);},
  alarm:()=>{tone(220,0.18,'sawtooth',0.1);tone(165,0.25,'sawtooth',0.1,0.15);},
  fail: ()=>tone(160,0.16,'square',0.08),
  splat:()=>tone(85,0.22,'sine',0.16),
};

// ---------------------------------------------------------------- Konstanten
const W=800, H=1100;                       // logische Weltgröße
const PLOT_COLS=[150,400,650];
const PLOT_ROWS=[235,395,555,715];
const WELL ={x:105,y:912}, STALL={x:662,y:905}, SHED={x:398,y:922};
const DAYLEN=75;                           // Sekunden pro Tag
const MAXDAY=10, GOAL=300;
const SEED_PRICE=5, BIO_PRICE=14;
const STAGE_DUR={seed:8,sprout:14,young:18,mature:12,blossom:10};
const STAGE_NEXT={seed:'sprout',sprout:'young',young:'mature',mature:'blossom',blossom:'fruiting'};
const FRUIT_WINDOW=30, OVERRIPE_WINDOW=15, WILT_LIMIT=12;
const GROWABLE=['seed','sprout','young','mature','blossom'];
const ALIVE=['seed','sprout','young','mature','blossom','fruiting','overripe'];

const TASKDEFS={
  plant:   {icon:'🌱', label:'Pflanzen',      dur:2.5},
  plantbio:{icon:'🌟', label:'Bio pflanzen',  dur:2.5},
  water:   {icon:'💧', label:'Gießen',        dur:1.8},
  trim:    {icon:'✂️', label:'Schneiden',     dur:3.4},
  spray:   {icon:'🧪', label:'Spritzen',      dur:2.2},
  fert:    {icon:'💩', label:'Düngen',        dur:2.0},
  harvest: {icon:'🧺', label:'Ernten',        dur:3.0},
  refill:  {icon:'🚰', label:'Kanne füllen',  dur:2.0},
  sell:    {icon:'💰', label:'Verkaufen',     dur:1.5},
};

// ---------------------------------------------------------------- Spielzustand
const state={ t:0, day:1, dayT:0, price:12, priceT:0, money:25,
  paused:true, over:false, won:false, totalEarned:0, totalHarvested:0, checkT:0 };
const inv={ seed:2, bio:0, pest:1, fert:0 };
const upg={ can:0, shears:0, barrow:0, plots:0 };

const plots=[];
for(let r=0;r<4;r++) for(let c=0;c<3;c++){
  plots.push({ x:PLOT_COLS[c], y:PLOT_ROWS[r], unlocked:r<3,
    stage:'empty', growth:0, t:0, water:1, wilt:0, over:0, pest:null,
    fruits:0, premium:false, seed:r*3+c+7 });
}

// canCap/carryCap/trimMul lesen weiterhin nur `upg.*` plus die Basiswerte des Akteurs —
// Schritt 3 übergibt hier stets `player` (statt eines der drei Arbeiter-Objekte von früher).
const canCap  = c=>c.canBase + upg.can*2;
const carryCap= c=>c.carryBase + upg.barrow*3;
const trimMul = ()=>[1,0.7,0.5][upg.shears];

const floats=[];   // {x,y,txt,t,color,size}

// ---------------------------------------------------------------- assets
const IMG={};
let dominikSmall=null;
function loadAssets(){
  // Nur noch die Frucht-Grafik wird gebraucht — Manni/Jannes/Benni gibt es als Charaktere
  // nicht mehr (Schritt 3: Solo-Ich-Perspektive), daher werden ihre Bilder nicht mehr geladen.
  const names=['dominik'];
  return Promise.all(names.map(n=>new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>{IMG[n]=im;res();};
    im.onerror=()=>rej(new Error('Bild fehlt: '+n+'.png'));
    im.src=n+'.png';
  })));
}
function prepSprites(){
  const dim=IMG.dominik, dh=96, dw=Math.round(dh*dim.width/dim.height);
  dominikSmall=document.createElement('canvas'); dominikSmall.width=dw; dominikSmall.height=dh;
  dominikSmall.getContext('2d').drawImage(dim,0,0,dw,dh);
}

// ---------------------------------------------------------------- Kamera & Projektion (Ego-Perspektive)
// Schritt 1: von Top-Down auf Ego-Perspektive umgestellt. Die Spielwelt (plots/WELL/STALL/SHED/…)
// bleibt exakt in denselben Weltkoordinaten (0..W, 0..H) — nur die Projektion auf den Bildschirm
// ändert sich. Schritt 2 (Steuerung) bewegt/dreht `player`; Schritt 3 (Interaktion/HUD) baut auf
// `project()`, `HORIZON_FRAC`/`horizonY` und den Billboard-Helfern weiter unten auf.
const FOV=70*Math.PI/180;         // horizontales Sichtfeld
const NEAR=24;                    // Nah-Clipping in Weltweinheiten
const HORIZON_FRAC=0.44;          // Horizontlinie als Anteil der Canvas-Höhe
const FIELD={x0:20,x1:W-20,y0:150,y1:1080}; // Feldgrenze für Zaunring/Perimeter

// Schritt 3: der Spieler ist jetzt der einzige Akteur (kein Manni/Jannes/Benni-Trio mehr) und
// trägt daher selbst die frühere Arbeiter-Statistik: `can` (Gießkannen-Ladungen), `carry`
// (getragene Dominiks), `work` (Zeitfaktor für Aktionen — <1 = schneller). Basiswerte bewusst
// etwas kräftiger als jeder Einzel-Arbeiter früher, weil man nun alles nacheinander statt zu
// dritt parallel erledigt; austariert, damit 300 € bis Tag 10 solo erreichbar bleiben.
// Spawn bewusst NICHT auf x≈400 (das liegt fast genau vor dem Laden bei (398,922) — dort würde
// der Schuppen beim Spielstart formatfüllend riesig im Bild stehen). x:240 schiebt Brunnen/
// Feststand/Laden alle weit genug aus dem 70°-Sichtfeld heraus (Winkel 34–71°, Abstand 186–443
// Welteinheiten, jeweils klar über den geforderten ≥100), sodass beim Start nur das freie Feld
// mit den Baumreihen und dem Banner zu sehen ist — keine Station "guckt" mit rein.
const player={ x:240, y:1040, ang:0, eye:92,
  canBase:8, carryBase:10, work:0.85, carry:0 };
player.can=player.canBase;
window.player=player; // Debug-/Testzugriff, auch für Schritt 2/3
// ang=0 → Blickrichtung -y (feldaufwärts, zum Zaun/Banner). Steigend = Drehung im Uhrzeigersinn.

// ---------------------------------------------------------------- Steuerung (Schritt 2)
// Tunables: Bewegung/Blick/Kollision — bewusst als benannte Konstanten, damit sie leicht
// nachjustiert werden können (z. B. wenn sich die Feldgröße/Layout in Zukunft ändert).
const MOVE_SPEED=210;        // Welteinheiten/Sek. beim Laufen (Feld ~800×800, Bäume ~160 u auseinander)
const LOOK_SENS=0.0028;      // Rad Gierwinkel pro Pixel Touch-/Maus-Drag (rechte Bildschirmhälfte)
const KEY_TURN_SPEED=2.1;    // Rad/Sek. Drehgeschwindigkeit für Q/E bzw. Pfeil-links/rechts
const PLAYER_RADIUS=24;      // Kollisionsradius des Spielers
const TREE_RADIUS=34;        // Kollisionsradius eines bepflanzten/lebendigen Beets
const TREE_RADIUS_EMPTY=18;  // leere/tote Beete sind flacher/schmaler — geringerer, aber spürbarer Radius
const BUILDING_RADIUS=44;    // Kollisionsradius Brunnen/Feststand/Laden (< Abstand Startposition↔Laden)
const FIELD_MARGIN=18;       // Mindestabstand des Spielers zum Zaun (FIELD-Grenze)
const JOY_MAX_R=55;          // maximale Auslenkung des virtuellen Joysticks in CSS-Pixeln
const JOY_DEADZONE=6;        // px Mindestauslenkung, bevor der Joystick überhaupt Bewegung meldet
const TAP_MOVE_THRESHOLD=10; // px — darunter zählt ein Pointer-Auf/Ab noch als Tap statt Kamera-Drag

// Eingabezustand: Touch (getrennt nach Bildschirmhälfte/pointerId, damit Bewegen+Schauen
// gleichzeitig funktionieren) + Tastatur. `touchPoints` merkt sich pro pointerId Start/Zustand,
// um am Ende (pointerup) zu entscheiden: Tap (→ doInteract()) oder Drag (→ Kamera).
const input={
  keys:Object.create(null),
  moveTouchId:null, joyOrigin:{x:0,y:0}, joyDX:0, joyDY:0, moveVec:{x:0,y:0}, // moveVec: x=strafe, y=vorwärts, je [-1,1]
  lookTouchId:null, lookLastX:0,
};
const touchPoints=new Map(); // pointerId -> {half, startX, startY, moved}

// Kollisionsobjekte: 12 Beete (Radius je nach Zustand) + 3 Gebäude. Günstig genug, um
// jeden Frame neu zusammengestellt zu werden (~15 Einträge).
function collisionObstacles(){
  const obs=[];
  for(const p of plots){
    obs.push({x:p.x, y:p.y, r:(p.stage==='empty'||p.stage==='dead')?TREE_RADIUS_EMPTY:TREE_RADIUS});
  }
  obs.push({x:WELL.x, y:WELL.y, r:BUILDING_RADIUS});
  obs.push({x:STALL.x, y:STALL.y, r:BUILDING_RADIUS});
  obs.push({x:SHED.x, y:SHED.y, r:BUILDING_RADIUS});
  return obs;
}
// Bewegt den Spieler um (dx,dy) in Weltkoordinaten, hält ihn im Zaun und schiebt ihn aus
// Bäumen/Gebäuden heraus (einfache Kreis-Kollision, 2 Durchläufe reichen bei dieser Objektzahl).
function clampField(x,y){
  return { x:clamp(x,FIELD.x0+FIELD_MARGIN,FIELD.x1-FIELD_MARGIN),
           y:clamp(y,FIELD.y0+FIELD_MARGIN,FIELD.y1-FIELD_MARGIN) };
}
function movePlayer(dx,dy){
  let nx=player.x+dx, ny=player.y+dy;
  ({x:nx,y:ny}=clampField(nx,ny));
  const obs=collisionObstacles();
  for(let pass=0;pass<4;pass++){
    for(const o of obs){
      const ox=nx-o.x, oy=ny-o.y, d=Math.hypot(ox,oy), minD=PLAYER_RADIUS+o.r;
      if(d<minD){
        if(d<1e-4){ nx=o.x+minD; ny=o.y; }
        else { const push=(minD-d)/d; nx+=ox*push; ny+=oy*push; }
      }
    }
    ({x:nx,y:ny}=clampField(nx,ny));
  }
  player.x=nx; player.y=ny;
}
// Bewegung/Drehung pro Frame anwenden — wird von update(dt) aufgerufen (bereits hinter dem
// paused/over-Check, daher automatisch deaktiviert während Modals/Tutorial/Spielende).
function updatePlayerControls(dt){
  let mvx=0, mvy=0; // lokal: x=strafe (rechts+), y=vorwärts (+)
  if(input.moveTouchId!=null){ mvx+=input.moveVec.x; mvy+=input.moveVec.y; }
  if(input.keys['w']) mvy+=1;
  if(input.keys['s']) mvy-=1;
  if(input.keys['a']) mvx-=1;
  if(input.keys['d']) mvx+=1;
  if(input.keys['arrowup']) mvy+=1;
  if(input.keys['arrowdown']) mvy-=1;
  const len=Math.hypot(mvx,mvy);
  if(len>0.001){
    if(len>1){ mvx/=len; mvy/=len; }
    const v=camVecs();
    movePlayer((v.fx*mvy+v.rx*mvx)*MOVE_SPEED*dt, (v.fy*mvy+v.ry*mvx)*MOVE_SPEED*dt);
  }
  let turn=0;
  if(input.keys['q']) turn-=1;
  if(input.keys['e']) turn+=1;
  if(input.keys['arrowleft']) turn-=1;
  if(input.keys['arrowright']) turn+=1;
  if(turn) player.ang+=turn*KEY_TURN_SPEED*dt;
}

// Liefert das nächstgelegene Ziel im engen Sichtkegel um die Blickrichtung (Fadenkreuz-Interaktion).
// Treibt in Schritt 3 den Kontext-Prompt, den ✋-Aktions-Button und die Boden-Hervorhebung an
// (siehe updateAimUI()/drawAimHighlight()). maxDist deutlich größer als der Kollisionsabstand
// (Spieler bleibt ~PLAYER_RADIUS+TREE_RADIUS/BUILDING_RADIUS ≈ 58–68 Welteinheiten entfernt stehen),
// damit man direkt nach dem Anlaufen ohne Nachjustieren interagieren kann.
function aimTarget(maxDist=260,maxAngle=0.30){
  const v=camVecs();
  const cands=[];
  for(let i=0;i<plots.length;i++) cands.push({kind:'plot', idx:i, x:plots[i].x, y:plots[i].y});
  cands.push({kind:'well', x:WELL.x, y:WELL.y});
  cands.push({kind:'stall', x:STALL.x, y:STALL.y});
  cands.push({kind:'shed', x:SHED.x, y:SHED.y});
  let best=null, bestScore=Infinity;
  for(const c of cands){
    const dx=c.x-player.x, dy=c.y-player.y;
    const forward=dx*v.fx+dy*v.fy, right=dx*v.rx+dy*v.ry;
    if(forward<=NEAR||forward>maxDist) continue;
    const angle=Math.atan2(right,forward);
    if(Math.abs(angle)>maxAngle) continue;
    const score=forward+Math.abs(angle)*120;
    if(score<bestScore){ bestScore=score; best=c; }
  }
  return best;
}

let dpr=1, cw=0, ch=0, focal=500, horizonY=200;

function camVecs(){ const s=Math.sin(player.ang), c=Math.cos(player.ang);
  return {fx:s, fy:-c, rx:c, ry:s}; } // forward/right-Einheitsvektoren der Kamera in Weltkoordinaten
/** Projiziert einen Weltpunkt (ox,oy) in den Kamera-/Bildschirmraum.
 *  @returns {sx, scale, forward, right} oder null, wenn der Punkt hinter/zu nah an der Kamera liegt. */
function project(ox,oy){
  const v=camVecs(), dx=ox-player.x, dy=oy-player.y;
  const right=dx*v.rx+dy*v.ry, forward=dx*v.fx+dy*v.fy;
  if(forward<=NEAR) return null;
  return { sx:cw/2+(right/forward)*focal, scale:focal/forward, forward, right };
}
// Bildschirm-Y der Bodenebene in gegebener Entfernung (Kamera ohne Neigung, feste Augenhöhe).
function groundScreenY(forward){ return horizonY+(player.eye/forward)*focal; }
// Umkehrung für Taps: Bodenpunkt unter einem Bildschirmpunkt (nur unterhalb des Horizonts gültig).
function screenToGround(sx,sy){
  if(sy<=horizonY+0.5) return null;
  const forward=player.eye*focal/(sy-horizonY), right=(sx-cw/2)/focal*forward;
  const v=camVecs();
  return { x:player.x+right*v.rx+forward*v.fx, y:player.y+right*v.ry+forward*v.fy };
}
const fogAlpha=forward=>clamp(1-forward/1500,0.12,1); // Distanz-Dunst Richtung Horizontfarbe

// ---------------------------------------------------------------- Canvas & Layout
const cvEl=document.getElementById('cv');

function resize(){
  const wrap=document.getElementById('wrap');
  cw=wrap.clientWidth; ch=wrap.clientHeight;      // Querformat: Canvas füllt #wrap komplett aus
  dpr=window.devicePixelRatio||1;
  cvEl.width=Math.round(cw*dpr); cvEl.height=Math.round(ch*dpr);
  focal=(cw*0.5)/Math.tan(FOV/2);
  horizonY=ch*HORIZON_FRAC;
}

// Kompatibel zur bestehenden UI-Logik (Aktionsmenü-Platzierung, Taps): projiziert über die
// Bodenebene statt orthografisch wie im alten Top-Down-Renderer.
function worldToScreen(x,y){
  const pr=project(x,y);
  if(!pr) return {x:-9999,y:-9999};
  return {x:pr.sx, y:groundScreenY(pr.forward)};
}
function screenToWorld(sx,sy){ return screenToGround(sx,sy) || {x:player.x,y:player.y}; }

// ---------------------------------------------------------------- Bäume
function plantAt(p,premium){
  Object.assign(p,{stage:'seed',growth:0,t:0,water:1,wilt:0,over:0,pest:null,fruits:0,premium});
}
function killTree(p,msg){
  const n=plots.indexOf(p)+1;
  Object.assign(p,{stage:'dead',growth:0,fruits:0,pest:null});
  toast(msg.replace('#',`#${n}`),'bad'); SND.splat();
}
function updateTree(p,dt){
  if(!p.unlocked||p.stage==='empty'||p.stage==='dead') return;
  const dayF=1+0.12*(state.day-1);
  // Wasser
  const drink=(p.stage==='seed'||p.stage==='sprout')?1/80:1/55;
  p.water=clamp(p.water - dt*drink*dayF*(p.premium?1.2:1),0,1);
  if(p.water<=0){
    p.wilt+=dt;
    if(p.wilt>=WILT_LIMIT){ killTree(p,'💀 Baum # ist vertrocknet! Gießen hilft, nur so als Tipp.'); return; }
  } else p.wilt=0;
  // Schädlinge
  if(p.pest){
    p.pest.ttl-=dt;
    if(p.pest.ttl<=0){ killTree(p,'🪲 Die Blattläuse haben Baum # dahingerafft!'); return; }
  }
  // Wildwuchs
  if(['young','mature','blossom','fruiting','overripe'].includes(p.stage))
    p.over=clamp(p.over+dt/60,0,1);
  // Wachstum
  if(GROWABLE.includes(p.stage) && p.water>0 && !p.pest){
    let rate=1/STAGE_DUR[p.stage];
    if(p.premium) rate*=1.35;
    if(p.over>0.6) rate*=0.6;
    p.growth+=dt*rate;
    if(p.growth>=1){
      const next=STAGE_NEXT[p.stage];
      p.stage=next; p.growth=0; p.t=0;
      if(next==='fruiting'){
        p.fruits=clamp(rndi(2,4)+(p.premium?1:0)-(p.over>0.6?1:0),1,5);
        toast(pick(['🍑 Dominik ist reif an Baum #N!','🍑 Baum #N trägt prächtige Dominiks!','🍑 Erntezeit an Baum #N!']).replace('#N','#'+(plots.indexOf(p)+1)),'good');
        SND.done();
      }
    }
  }
  // Früchte reifen über
  if(p.stage==='fruiting'){
    p.t+=dt;
    if(p.t>=FRUIT_WINDOW){ p.stage='overripe'; p.t=0;
      toast('🫠 Die Dominiks an Baum #'+(plots.indexOf(p)+1)+' werden matschig! Schnell ernten!','warn'); }
  } else if(p.stage==='overripe'){
    p.t+=dt;
    if(p.t>=OVERRIPE_WINDOW){
      p.stage='mature'; p.growth=0.2; p.fruits=0; p.t=0;
      toast('💦 Platsch. Die Dominiks an Baum #'+(plots.indexOf(p)+1)+' sind zu Matsch zerfallen.','bad');
      SND.splat();
    }
  }
}
function spawnPests(dt){
  if(state.day<2) return;
  const active=plots.filter(p=>p.pest).length;
  const cap=Math.min(3,Math.ceil(state.day/3));
  if(active>=cap) return;
  for(const p of plots){
    if(!p.unlocked||p.pest) continue;
    if(!['young','mature','blossom','fruiting','overripe'].includes(p.stage)) continue;
    if(Math.random()<dt*(0.002+0.0012*state.day)){
      p.pest={ttl:Math.max(12,24-state.day), max:Math.max(12,24-state.day)};
      toast('🪲 Blattläuse befallen Baum #'+(plots.indexOf(p)+1)+'! Pestizid, zackig!','bad',4200);
      SND.alarm();
      return;
    }
  }
}

// ---------------------------------------------------------------- Aufgaben
// Schritt 3: kein Warteschlangen-Trio mehr — der Spieler geht selbst hin und macht die Arbeit.
// `canDoNow`/`completeTask` bleiben (fast) unverändert, werden jetzt aber stets mit `player`
// statt einem Arbeiter-Objekt aufgerufen. Meldungen wurden von "Manni/Jannes/Benni" auf "Du" umgestellt.
function canDoNow(c,task){
  const p=task.plot!=null?plots[task.plot]:null;
  switch(task.type){
    case 'plant':    if(!(p.stage==='empty'||p.stage==='dead')) return 'Da wächst schon was!';
                     if(inv.seed<1) return 'Keine Samen mehr!'; return true;
    case 'plantbio': if(!(p.stage==='empty'||p.stage==='dead')) return 'Da wächst schon was!';
                     if(inv.bio<1) return 'Keine Bio-Samen mehr!'; return true;
    case 'water':    if(!ALIVE.includes(p.stage)) return 'Hier gibt es nichts zu gießen.';
                     if(c.can<1) return 'Deine Gießkanne ist leer!'; return true;
    case 'trim':     if(!ALIVE.includes(p.stage)||p.over<0.15) return 'Nichts zu schneiden.'; return true;
    case 'spray':    if(!p.pest) return 'Keine Schädlinge (mehr) da.';
                     if(inv.pest<1) return 'Kein Pestizid im Lager!'; return true;
    case 'fert':     if(!GROWABLE.includes(p.stage)) return 'Düngen bringt hier nichts.';
                     if(inv.fert<1) return 'Kein Dünger im Lager!'; return true;
    case 'harvest':  if(!(p.stage==='fruiting'||p.stage==='overripe')) return 'Keine reifen Dominiks.';
                     if(c.carry>=carryCap(c)) return 'Du kannst nichts mehr tragen!'; return true;
    case 'refill':   if(c.can>=canCap(c)) return 'Kanne ist schon voll.'; return true;
    case 'sell':     if(c.carry<1) return 'Du hast nichts zu verkaufen.'; return true;
  }
  return true;
}
function completeTask(c,task){
  const p=task.plot!=null?plots[task.plot]:null;
  const head={x:c.x,y:c.y-150};
  switch(task.type){
    case 'plant':    inv.seed--; plantAt(p,false); addFloat(p.x,p.y-60,'🌱'); break;
    case 'plantbio': inv.bio--;  plantAt(p,true);  addFloat(p.x,p.y-60,'🌟'); break;
    case 'water':    p.water=1; p.wilt=0; c.can--; addFloat(p.x,p.y-80,'💧','#7cc7ff'); break;
    case 'trim':     p.over=0; addFloat(p.x,p.y-90,'✂️'); break;
    case 'spray':    inv.pest--; p.pest=null; addFloat(p.x,p.y-90,'🪲✖','#ffb0b0'); break;
    case 'fert':     inv.fert--; p.growth=clamp(p.growth+0.45,0,0.99); p.water=clamp(p.water-0.15,0.05,1);
                     addFloat(p.x,p.y-80,'💩'); break;
    case 'harvest': {
      const space=carryCap(c)-c.carry;
      let avail=p.stage==='overripe'?Math.max(1,Math.ceil(p.fruits/2)):p.fruits;
      const take=Math.min(avail,space);
      c.carry+=take; state.totalHarvested+=take;
      addFloat(head.x,head.y,'+'+take+' Dominik'+(take>1?'s':''),'#ffd76a');
      if(p.stage==='overripe'){ p.stage='mature'; p.growth=0.2; p.fruits=0; p.t=0; }
      else { p.fruits-=take; if(p.fruits<=0){ p.stage='mature'; p.growth=0.2; p.t=0; } }
      break;
    }
    case 'refill':   c.can=canCap(c); addFloat(WELL.x,WELL.y-90,'💧💧','#7cc7ff'); break;
    case 'sell': {
      const sum=Math.round(c.carry*state.price);
      state.money+=sum; state.totalEarned+=sum;
      addFloat(STALL.x,STALL.y-110,'+'+sum+' €','#ffd76a',22);
      toast(pick(['💰 '+c.carry+' Dominiks verkauft! Das Fest jubelt.',
                  '💰 Frische Dominiks! Gehen weg wie warme Semmeln.',
                  '💰 Die Dominik-Börse dankt.'] ),'good',2200);
      c.carry=0; SND.coin(); updateHUD();
      break;
    }
  }
  if(task.type!=='sell') SND.done();
  updateHUD();
}
// Ego-Aktionsablauf: ausgewählte Aktion nimmt sichtbar Zeit in Anspruch (Fortschrittsbalken),
// bevor sie via completeTask() angewendet wird. Nur eine Aktion gleichzeitig — Bewegung wird
// währenddessen eingefroren (siehe update()).
let activeAction=null; // {type, plot, dur, prog}
function startAction(type,plotIdx=null){
  const task={type,plot:plotIdx};
  const ok=canDoNow(player,task);
  if(ok!==true){ toast('🤷 '+ok,'warn',2400); SND.fail(); return false; }
  const dur=TASKDEFS[type].dur*player.work*(type==='trim'?trimMul():1);
  activeAction={type,plot:plotIdx,dur,prog:0};
  SND.enq();
  return true;
}
function updateActiveAction(dt){
  if(!activeAction) return;
  activeAction.prog+=dt;
  if(activeAction.prog>=activeAction.dur){
    const task={type:activeAction.type,plot:activeAction.plot};
    const ok=canDoNow(player,task);       // z. B. Frucht ist inzwischen zermatscht
    if(ok===true) completeTask(player,task);
    else { addFloat(player.x,player.y-160,'❓','#ffb0b0'); toast('🤷 '+ok,'warn',2200); SND.fail(); }
    activeAction=null;
  }
}

// ---------------------------------------------------------------- gültige Aktionen
function plotActions(p){
  const acts=[];
  if(!p.unlocked) return acts;
  if(p.stage==='empty'||p.stage==='dead'){
    acts.push({type:'plant',  cnt:inv.seed, dis:inv.seed<1});
    acts.push({type:'plantbio',cnt:inv.bio, dis:inv.bio<1});
    return acts;
  }
  if(ALIVE.includes(p.stage)){
    if(p.water<0.95) acts.push({type:'water'});
    if(p.over>=0.15) acts.push({type:'trim'});
    if(p.pest)       acts.push({type:'spray', cnt:inv.pest, dis:inv.pest<1});
    if(GROWABLE.includes(p.stage)) acts.push({type:'fert', cnt:inv.fert, dis:inv.fert<1});
    if(p.stage==='fruiting'||p.stage==='overripe') acts.push({type:'harvest'});
  }
  return acts;
}

// (Fadenkreuz) zeigt über aimTarget() an, was gerade in Reichweite ist; der ✋-Aktions-Button
// (oder ein kurzer Tap ohne Kamera-Drag) löst die passende Interaktion aus.

function closeMenu(){ amenu.classList.add('hidden'); }
function openMenuForPlot(pi){

      startAction(a.type,pi);
    });

  }
  amenu.classList.remove('hidden');
  // Landscape: mittig-oben platzieren (bleibt fern von Joystick unten-links und Aktions-Button
  // unten-rechts, unabhängig davon, wo der Baum gerade auf dem breiten Bildschirm projiziert wird).
  const wrap=document.getElementById('wrap');
  const mw=amenu.offsetWidth, mh=amenu.offsetHeight;
  amenu.style.left=clamp((wrap.clientWidth-mw)/2, 6, wrap.clientWidth-mw-6)+'px';
  amenu.style.top =clamp(wrap.clientHeight*0.24, 6, wrap.clientHeight-mh-6)+'px';
}
// Zentrale Interaktion: was der Spieler gerade anvisiert (aimTarget()) bestimmt, was der
// ✋-Aktions-Button (bzw. ein kurzer Tap) auslöst.
let currentAim=null;
function doInteract(){
  if(state.paused||state.over) return;
  if(activeAction) return;                       // schon mitten in einer Aktion
  if(!amenu.classList.contains('hidden')) return; // Menü ist offen — erst dort wählen
  const a=currentAim;
  if(!a){ toast('🤷 Nichts in Reichweite.','',1400); return; }
  if(a.kind==='plot'){
    const p=plots[a.idx];
    if(!p.unlocked){ toast('🚧 Diese Parzelle kannst du im Laden kaufen!','warn'); return; }
    openMenuForPlot(a.idx);
    return;
  }
  if(a.kind==='well'){ startAction('refill'); return; }
  if(a.kind==='stall'){ startAction('sell'); return; }
  if(a.kind==='shed'){ openShop(); return; }
}
document.getElementById('btnInteract').addEventListener('pointerdown',e=>{
  e.preventDefault(); e.stopPropagation();
  ac(); doInteract();
});
// Pointer-Routing (Schritt 2/3): linke Bildschirmhälfte = virtueller Joystick (Bewegen),
// rechte Hälfte = Drag-to-Look (Gieren). Mehrere gleichzeitige Pointer (pointerId) werden
// getrennt verfolgt, damit auf Touch gleichzeitig bewegt UND geschaut werden kann. Ein
// Pointer, der sich nie über TAP_MOVE_THRESHOLD hinaus bewegt, zählt als Tap und löst — genau
// wie der ✋-Button — die Interaktion mit dem aktuell anvisierten Ziel aus.
cvEl.addEventListener('pointerdown',e=>{
  e.preventDefault();
  ac(); // Audio freischalten
  if(!amenu.classList.contains('hidden')){ closeMenu(); return; }
  if(state.paused||state.over) return; // keine Bewegung/Blick/Tap während Modal/Pause/Ende
  const r=cvEl.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  try{ cvEl.setPointerCapture(e.pointerId); }catch(err){}
  const half=x<r.width/2?'left':'right';
  touchPoints.set(e.pointerId,{half,startX:x,startY:y,moved:false});
  if(half==='left'){
    input.moveTouchId=e.pointerId;
    input.joyOrigin.x=x; input.joyOrigin.y=y; input.joyDX=0; input.joyDY=0;
    input.moveVec.x=0; input.moveVec.y=0;
  } else {
    input.lookTouchId=e.pointerId;
    input.lookLastX=x;
  }
});
cvEl.addEventListener('pointermove',e=>{
  const ts=touchPoints.get(e.pointerId); if(!ts) return;
  const r=cvEl.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  if(Math.hypot(x-ts.startX,y-ts.startY)>TAP_MOVE_THRESHOLD) ts.moved=true;
  if(e.pointerId===input.moveTouchId){
    let dx=x-input.joyOrigin.x, dy=y-input.joyOrigin.y;
    const d=Math.hypot(dx,dy);
    if(d>JOY_MAX_R){ dx*=JOY_MAX_R/d; dy*=JOY_MAX_R/d; }
    input.joyDX=dx; input.joyDY=dy;
    input.moveVec.x=Math.abs(dx)<JOY_DEADZONE?0:dx/JOY_MAX_R;
    input.moveVec.y=Math.abs(dy)<JOY_DEADZONE?0:-dy/JOY_MAX_R; // Bildschirm-Y invertiert: hoch = vorwärts
  } else if(e.pointerId===input.lookTouchId){
    player.ang += (x-input.lookLastX)*LOOK_SENS;
    input.lookLastX=x;
  }
});
function endPointer(e){
  const ts=touchPoints.get(e.pointerId); if(!ts) return;
  touchPoints.delete(e.pointerId);
  if(e.pointerId===input.moveTouchId){ input.moveTouchId=null; input.moveVec.x=0; input.moveVec.y=0; }
  if(e.pointerId===input.lookTouchId){ input.lookTouchId=null; }
  if(!ts.moved && !state.paused && !state.over) doInteract();
}
cvEl.addEventListener('pointerup',endPointer);
cvEl.addEventListener('pointercancel',endPointer);

function hideModal(){ modal.classList.add('hidden'); if(!state.over) state.paused=false; }
function openShop(){
  let html='<h2>🛒 Dominiks Gartenbedarf</h2><div id="shopmoney">💰 '+state.money+' €</div>';
  for(const it of SHOP){
    const maxed=it.max!=null && it.lvl()>=it.max;
    const pr=maxed?null:it.price();
    const lvlTxt=it.max!=null?('Stufe '+it.lvl()+'/'+it.max):'';
    html+=`<div class="shopitem"><div class="ico">${it.ico}</div>
      <div class="txt"><div class="nm">${it.nm}</div><div class="ds">${it.ds}</div>
      <div class="own">${it.own?it.own():lvlTxt}</div></div>
      <button data-buy="${it.id}" ${maxed||pr>state.money?'disabled':''}>
        ${maxed?'Max ✔':pr+' €'}</button></div>`;
  }
  html+='<div class="btnrow"><button class="primary" data-act="close">Schließen</button></div>';
  showModal(html);
}
mbox.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.buy){
    const it=SHOP.find(s=>s.id===b.dataset.buy);
    const pr=it.price();
    if(state.money>=pr){
      state.money-=pr; it.buy(); SND.coin();
      toast('🛒 Gekauft: '+it.nm,'good',1800);
      updateHUD(); openShop();
    }
  }
  else if(b.dataset.act==='close') hideModal();
  else if(b.dataset.act==='start'){ localStorage.setItem('edf_tut','1'); hideModal(); }
  else if(b.dataset.act==='resume') hideModal();
  else if(b.dataset.act==='restart') location.reload();
});

function endScreen(winner,msg){
  state.over=true; state.paused=true;
  const best=Math.max(state.totalEarned, +(localStorage.getItem('edf_best')||0));
  localStorage.setItem('edf_best',best);
  showModal(`<h2>${winner?'🎉 Das Fest ist gerettet!':'😢 Das Fest fällt aus …'}</h2>
  <p>${msg}</p>
  <p>📊 Bilanz: <b>${state.totalHarvested}</b> Dominiks geerntet,
  <b>${state.totalEarned} €</b> verdient (Rekord: ${best} €), Tag ${state.day}.</p>
  ${winner?'<div class="btnrow"><button data-act="endless">Weiterspielen 🌾</button><button class="primary" data-act="restart">Neu starten 🔄</button></div>'
          :'<div class="btnrow"><button class="primary" data-act="restart">Nochmal versuchen 🔄</button></div>'}`);
  if(winner){
    mbox.querySelector('[data-act=endless]').addEventListener('click',()=>{
      state.over=false; hideModal();
      toast('🌾 Endlos-Modus! Wie viele Dominiks schaffst du?','good');
    });
  }
}
function checkWin(){
  if(!state.won && state.money>=GOAL){
    state.won=true;
    endScreen(true,`Du hast das Festbudget von ${GOAL} € zusammen — Dominiks, so weit das Auge reicht!
    Ganz ${['Deutschland','das Dorf','Ostwestfalen'][rndi(0,2)]} feiert das ErnteDominiksFest.`);
    state.over=false; // Sieg beendet das Spiel nicht hart
    state.paused=true;
  }
}
function checkBankrupt(){
  const anyAlive=plots.some(p=>p.unlocked&&ALIVE.includes(p.stage));
  if(!anyAlive && player.carry<1 && inv.seed<1 && inv.bio<1 && state.money<SEED_PRICE && !state.won){
    endScreen(false,'Pleite! Keine Bäume, keine Samen, kein Geld. Dominik ist untröstlich.');
  }
}
function newDay(){
  state.day++;
  if(state.day>MAXDAY && !state.won){
    endScreen(false,`Tag ${MAXDAY} ist vorbei und die Festkasse blieb unter ${GOAL} €.
    Die Gäste müssen dieses Jahr ohne Dominiks feiern. Tragisch.`);
    return;
  }
  const flavor=['Die Blattläuse werden mutiger …','Die Sonne brennt — Bäume dursten schneller!',
    'Die Dominik-Börse wird nervöser.','Dominik-Nachfrage steigt!'];
  toast('🌅 Tag '+state.day+(state.day<=MAXDAY?'/'+MAXDAY:'')+' bricht an. '+pick(flavor),'',3600);
}

// ---------------------------------------------------------------- Rendering (Ego-Perspektive/Billboards)
const grassPatches=(()=>{const r=mulberry(42),a=[];
  for(let i=0;i<26;i++)a.push({x:r()*W,y:120+r()*(H-160),rx:20+r()*45,ry:8+r()*16,c:r()});
  return a;})();
const flowers=(()=>{const r=mulberry(7),a=[];
  for(let i=0;i<40;i++)a.push({x:r()*W,y:130+r()*(H-170),h:r()});
  return a;})();
function rr(g,x,y,w,h,r){ g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

// ---- Kunstwerk in lokalem (Offscreen-)Koordinatenraum. Identisch zur alten Top-Down-Zeichnung,
// nur auf einen übergebenen Kontext `g` statt des globalen `ctx` umgestellt, damit es sowohl
// direkt als auch (weiter unten) via blitArt() als Billboard verwendet werden kann.
function fruitSlots(p){
  const r=mulberry(p.seed), n=5, out=[];
  for(let i=0;i<n;i++){
    const ang=-0.15-Math.PI*0.7*(i/(n-1))-r()*0.25+ (i%2?0.15:0);
    const rad=26+r()*16;
    out.push({dx:Math.cos(ang+Math.PI*-0.0)*rad*1.15, dy:Math.sin(ang)*rad-14+r()*10});
  }
  return out;
}
function drawTreeArt(g,lx,ly,p,pi){
  const x=lx, y=ly;
  // Beet
  g.fillStyle='#8d6e42'; g.beginPath(); g.ellipse(x,y,56,20,0,0,7); g.fill();
  g.fillStyle='#7a5c34'; g.beginPath(); g.ellipse(x,y,56,20,0,0,7); g.lineWidth=3; g.strokeStyle='#6b4f2c'; g.stroke();
  g.fillStyle='rgba(255,255,255,.55)'; g.font='bold 12px system-ui'; g.textAlign='center';
  g.fillText('#'+(pi+1),x+42,y+16);
  if(!p.unlocked){
    g.strokeStyle='rgba(255,255,255,.5)'; g.setLineDash([8,7]); g.lineWidth=3;
    g.beginPath(); g.ellipse(x,y-30,60,52,0,0,7); g.stroke(); g.setLineDash([]);
    g.font='26px system-ui'; g.fillText('🚧',x,y-30);
    g.fillStyle='rgba(255,255,255,.75)'; g.font='bold 12px system-ui';
    g.fillText('Zu verkaufen',x,y-2);
    return;
  }
  if(p.stage==='empty') return;
  if(p.stage==='dead'){
    g.strokeStyle='#6e625a'; g.lineWidth=9; g.lineCap='round';
    g.beginPath(); g.moveTo(x,y); g.lineTo(x,y-58); g.stroke();
    g.lineWidth=6;
    g.beginPath(); g.moveTo(x,y-40); g.lineTo(x-22,y-62); g.moveTo(x,y-52); g.lineTo(x+20,y-72); g.stroke();
    g.font='16px system-ui'; g.textAlign='center'; g.fillText('💀',x,y-84);
    return;
  }
  const dry=1-clamp(p.water*3,0,1);            // erst unter 33 % sichtbar
  const wiltF=clamp(p.wilt/WILT_LIMIT,0,1);
  const droop=wiltF*8+dry*3;
  const leaf=(l)=>{ // Grün, ausgedörrt Richtung oliv/braun
    const r1=Math.round(lerp(63,138,Math.max(dry*0.7,wiltF)));
    const g1=Math.round(lerp(150,120,Math.max(dry*0.7,wiltF)));
    const b1=Math.round(lerp(70,52,Math.max(dry*0.7,wiltF)));
    return `rgb(${r1+l},${g1+l},${b1})`;
  };
  const overScale=1+p.over*0.3;
  if(p.stage==='seed'){
    g.fillStyle='#6b4f2c'; g.beginPath(); g.ellipse(x,y-4,14,7,0,0,7); g.fill();
    if(p.growth>0.5){ g.strokeStyle='#4c9b52'; g.lineWidth=4; g.lineCap='round';
      g.beginPath(); g.moveTo(x,y-6); g.lineTo(x,y-16); g.stroke(); }
  } else if(p.stage==='sprout'){
    g.strokeStyle='#5d8c3e'; g.lineWidth=5; g.lineCap='round';
    g.beginPath(); g.moveTo(x,y); g.lineTo(x,y-26+droop*0.5); g.stroke();
    g.fillStyle=leaf(0); g.beginPath(); g.arc(x-8,y-28+droop,9,0,7); g.arc(x+8,y-30+droop,9,0,7); g.fill();
  } else {
    const big=p.stage!=='young';
    const th=big?58:38, tw=big?13:9, cr=(big?40:26)*overScale, cy=y-th-(big?22:12)+droop;
    g.fillStyle='#7a5a34'; rr(g,x-tw/2,y-th,tw,th,4); g.fill();
    g.fillStyle=leaf(-12); g.beginPath(); g.arc(x-cr*0.55,cy+8,cr*0.72,0,7); g.arc(x+cr*0.55,cy+8,cr*0.72,0,7); g.fill();
    g.fillStyle=leaf(0); g.beginPath(); g.arc(x,cy-6,cr,0,7); g.fill();
    g.fillStyle=leaf(14); g.beginPath(); g.arc(x-cr*0.3,cy-cr*0.45,cr*0.5,0,7); g.fill();
    if(p.over>0.5){ // wilde Triebe
      g.strokeStyle=leaf(-18); g.lineWidth=4; g.lineCap='round';
      const r=mulberry(p.seed*3);
      for(let i=0;i<5;i++){ const a=r()*Math.PI*2;
        g.beginPath(); g.moveTo(x+Math.cos(a)*cr*0.8,cy+Math.sin(a)*cr*0.8);
        g.lineTo(x+Math.cos(a)*(cr*0.8+16+p.over*14),cy+Math.sin(a)*(cr*0.8+16+p.over*14)); g.stroke(); }
    }
    if(p.stage==='blossom'){
      const r=mulberry(p.seed*5);
      g.fillStyle='#fff0f4';
      for(let i=0;i<8;i++){ g.beginPath();
        g.arc(x+(r()-0.5)*cr*1.7, cy+(r()-0.5)*cr*1.4, 4.5,0,7); g.fill(); }
    }
    if((p.stage==='fruiting'||p.stage==='overripe') && dominikSmall){
      const slots=fruitSlots(p);
      const fh=30, fw=dominikSmall.width*(fh/dominikSmall.height);
      for(let i=0;i<p.fruits;i++){
        const s=slots[i%slots.length];
        const wob=Math.sin(state.t*2.1+i*1.7)*0.09;
        g.save();
        g.translate(x+s.dx, cy+s.dy+10);
        g.rotate(wob);
        g.drawImage(dominikSmall,-fw/2,-4,fw,fh);
        if(p.stage==='overripe'){
          g.fillStyle='rgba(200,110,20,.4)';
          g.beginPath(); g.ellipse(0,fh/2-4,fw/2,fh/2,0,0,7); g.fill();
        }
        g.restore();
      }
      if(p.stage==='overripe'){ // Fliegen
        g.fillStyle='#222';
        for(let i=0;i<4;i++){ const a=state.t*3+i*1.9;
          g.beginPath(); g.arc(x+Math.cos(a)*(cr+12), cy+Math.sin(a*1.3)*14-8, 2.2,0,7); g.fill(); }
      }
    }
    if(p.pest){ // krabbelnde Läuse
      g.fillStyle='#902020';
      const r=mulberry(p.seed*9);
      for(let i=0;i<5;i++){
        const a=r()*6.28+state.t*(0.6+r());
        g.beginPath(); g.arc(x+Math.cos(a)*cr*0.75, cy+Math.sin(a)*cr*0.6, 3.4,0,7); g.fill();
      }
    }
  }
  // Statussymbole über dem Baum
  let iy=y-135; const icons=[];
  if(p.pest) icons.push({t:'🪲',ring:p.pest.ttl/p.pest.max,c:'#ff5c5c'});
  if(p.water<0.35 && ALIVE.includes(p.stage)) icons.push({t:'💧',blink:true,c:'#7cc7ff'});
  if(p.over>0.6) icons.push({t:'✂️',c:'#ffd76a'});
  if(p.stage==='fruiting') icons.push({t:'🧺',ring:1-p.t/FRUIT_WINDOW,c:'#7dff8a'});
  if(p.stage==='overripe') icons.push({t:'⏳',ring:1-p.t/OVERRIPE_WINDOW,c:'#ff9d3c',blink:true});
  let ix=x-(icons.length-1)*17;
  for(const ic of icons){
    if(ic.blink && Math.floor(state.t*3)%2===0){ ix+=34; continue; }
    g.fillStyle='rgba(20,35,20,.75)'; g.beginPath(); g.arc(ix,iy,14,0,7); g.fill();
    if(ic.ring!=null){ g.strokeStyle=ic.c; g.lineWidth=3;
      g.beginPath(); g.arc(ix,iy,14,-Math.PI/2,-Math.PI/2+6.28*clamp(ic.ring,0,1)); g.stroke(); }
    g.font='14px system-ui'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(ic.t,ix,iy+1); g.textBaseline='alphabetic';
    ix+=34;
  }
  // Laufende Aktion des Spielers an diesem Baum (Schritt 3: statt Ziel-Marken der drei Arbeiter).
  if(activeAction && activeAction.plot===pi){
    const pct=clamp(activeAction.prog/activeAction.dur,0,1);
    g.fillStyle='rgba(20,35,20,.75)'; g.beginPath(); g.arc(x,y+18,11,0,7); g.fill();
    g.strokeStyle='#ffd76a'; g.lineWidth=3;
    g.beginPath(); g.arc(x,y+18,11,-Math.PI/2,-Math.PI/2+6.28*pct); g.stroke();
    g.font='12px system-ui'; g.textAlign='center'; g.textBaseline='middle';
    g.fillStyle='#fff'; g.fillText(TASKDEFS[activeAction.type].icon,x,y+19);
    g.textBaseline='alphabetic';
  }
}

  g.fillStyle='#6d6d6d'; g.beginPath(); g.ellipse(x,y-4,36,14,0,0,7); g.fill();
  g.fillStyle='#3f7fbf'; g.beginPath(); g.ellipse(x,y-4,28,10,0,0,7); g.fill();

function drawStallArt(g,x,y){

  g.strokeStyle='#7a5a34'; g.lineWidth=6; g.lineCap='round';
  g.beginPath(); g.moveTo(x-58,y-42); g.lineTo(x-58,y-100); g.moveTo(x+58,y-42); g.lineTo(x+58,y-100); g.stroke();

}

}
function drawBannerArt(g){

// ---- Offscreen-Leinwände: das Kunstwerk oben wird hier vorgerendert und per blitArt() (weiter
// unten) perspektivisch als Billboard in die Szene geblittet. Bäume ändern sich (Wachstum/
// Animation), daher wird refreshTreeArt() jeden Frame neu gezeichnet; Stationen/Banner sind
// statisch und werden einmalig beim Laden vorbereitet.
const TREE_ART_W=300, TREE_ART_H=220, TREE_ART_AX=150, TREE_ART_AY=170;
const treeArt=plots.map(()=>{ const c=document.createElement('canvas'); c.width=TREE_ART_W; c.height=TREE_ART_H; return c; });
function refreshTreeArt(pi){
  const cnv=treeArt[pi], g=cnv.getContext('2d');
  g.clearRect(0,0,cnv.width,cnv.height);
  drawTreeArt(g,TREE_ART_AX,TREE_ART_AY,plots[pi],pi);
}
const STA_W=220, STA_H=200, STA_AX=110, STA_AY=160;
const BANNER_W=400, BANNER_H=60, BANNER_AX=200, BANNER_AY=60;
const BANNER_POS={x:W/2, y:130};
let wellArt=null, stallArt=null, shedArt=null, bannerArt=null;
function makeArt(w,h,drawFn){ const c=document.createElement('canvas'); c.width=w; c.height=h; drawFn(c.getContext('2d')); return c; }
function prepStationArt(){
  wellArt  = makeArt(STA_W,STA_H, g=>drawWellArt(g,STA_AX,STA_AY));
  stallArt = makeArt(STA_W,STA_H, g=>drawStallArt(g,STA_AX,STA_AY));
  shedArt  = makeArt(STA_W,STA_H, g=>drawShedArt(g,STA_AX,STA_AY));
  bannerArt= makeArt(BANNER_W,BANNER_H, g=>drawBannerArt(g));
}

// ---- Zaunring ums Feld — reine Prop-Billboards (kein vorgerendertes Kunstwerk nötig).
function buildFencePosts(){
  const posts=[];
  for(let x=FIELD.x0;x<=FIELD.x1;x+=70){ posts.push({x,y:FIELD.y0}); posts.push({x,y:FIELD.y1}); }
  for(let y=FIELD.y0;y<=FIELD.y1;y+=110){ posts.push({x:FIELD.x0,y}); posts.push({x:FIELD.x1,y}); }
  return posts;
}
const fencePosts=buildFencePosts();

// ---- Wiederverwendbare Billboard-Grundbausteine (Basis für Schritt 2/3: Spieler-Requisiten,
// Interaktions-Hervorhebungen etc. können dieselben Helfer benutzen).
function blitArt(pr,art,ax,ay){
  if(!art) return;
  const gY=groundScreenY(pr.forward), w=art.width*pr.scale, h=art.height*pr.scale;
  ctx.globalAlpha=fogAlpha(pr.forward);
  ctx.drawImage(art, pr.sx-ax*pr.scale, gY-ay*pr.scale, w, h);
  ctx.globalAlpha=1;
}
function drawPropBillboard(px,py,worldW,worldH,color){
  const pr=project(px,py); if(!pr) return null;
  const gY=groundScreenY(pr.forward), w=Math.max(1,worldW*pr.scale), h=Math.max(1,worldH*pr.scale);
  ctx.globalAlpha=fogAlpha(pr.forward);
  ctx.fillStyle=color; ctx.fillRect(pr.sx-w/2, gY-h, w, h);
  ctx.globalAlpha=1;
  return pr;
}
function drawGroundScatter(pr,rx,ry,color){
  const gY=groundScreenY(pr.forward);
  ctx.globalAlpha=fogAlpha(pr.forward)*0.9;
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.ellipse(pr.sx,gY,Math.max(0.6,rx*pr.scale),Math.max(0.4,ry*pr.scale*0.45),0,0,7); ctx.fill();
  ctx.globalAlpha=1;
}

// ---- Himmel & Boden
function drawSkyAndGround(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const sky=ctx.createLinearGradient(0,0,0,horizonY);
  sky.addColorStop(0,'#bfe6ff'); sky.addColorStop(1,'#eaf7e2');
  ctx.fillStyle=sky; ctx.fillRect(0,0,cw,horizonY);
  const grd=ctx.createLinearGradient(0,horizonY,0,ch);
  grd.addColorStop(0,'#7fb95a'); grd.addColorStop(1,'#3c7233');
  ctx.fillStyle=grd; ctx.fillRect(0,horizonY,cw,ch-horizonY);
  // Perspektivische Entfernungsbänder — machen Bewegung/Tiefe auch ohne Details lesbar.
  ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.lineWidth=1;
  for(const d of [60,120,220,380,600,900,1350]){
    const gy=groundScreenY(d);
    if(gy<horizonY||gy>ch) continue;
    ctx.globalAlpha=fogAlpha(d)*0.5;
    ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(cw,gy); ctx.stroke();
  }
  // Fluchtlinien Richtung Horizont (Feld-Furchen).
  ctx.strokeStyle='rgba(255,255,255,.09)';
  for(const fx of [-0.9,-0.5,-0.2,0.2,0.5,0.9]){
    ctx.beginPath(); ctx.moveTo(cw/2,horizonY); ctx.lineTo(cw/2+fx*cw,ch); ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawDuskOverlay(){
  if(state.dayT>0.72){
    const a=(state.dayT-0.72)/0.28*0.32;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle=`rgba(26,32,80,${a})`; ctx.fillRect(0,0,cw,ch);
  }
}
function drawFloatsFP(dt){
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i]; f.t+=dt;
    if(f.t>1.6){ floats.splice(i,1); continue; }
    const pr=project(f.x,f.y); if(!pr) continue;
    const gY=groundScreenY(pr.forward);
    ctx.globalAlpha=clamp(1.6-f.t,0,1)*fogAlpha(pr.forward);
    ctx.fillStyle=f.color; ctx.font='bold '+Math.max(9,f.size*pr.scale)+'px system-ui'; ctx.textAlign='center';
    ctx.fillText(f.txt,pr.sx,gY-f.t*34*pr.scale);
    ctx.globalAlpha=1;
  }
}
// Hervorhebung des aktuell anvisierten Ziels (Schritt 3): ein pulsierender Ring am Boden unter
// Baum/Brunnen/Feststand/Laden, sobald aimTarget() darauf zeigt — macht die Fadenkreuz-Interaktion
// klar erkennbar, ohne die vorgerenderten Billboards selbst anfassen zu müssen.
function drawAimHighlight(){
  if(!currentAim) return;
  let wx,wy;
  if(currentAim.kind==='plot'){ const p=plots[currentAim.idx]; wx=p.x; wy=p.y; }
  else { wx=currentAim.x; wy=currentAim.y; }
  const pr=project(wx,wy); if(!pr) return;
  const gY=groundScreenY(pr.forward);
  const pulse=0.5+0.5*Math.sin(state.t*6);
  ctx.save();
  ctx.globalAlpha=fogAlpha(pr.forward)*(0.5+0.3*pulse);
  ctx.strokeStyle='#ffd76a'; ctx.lineWidth=Math.max(1.5,3*pr.scale);
  ctx.beginPath(); ctx.ellipse(pr.sx,gY,55*pr.scale,20*pr.scale,0,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

// ---- Billboards sammeln, nach Entfernung sortieren (am weitesten zuerst) und zeichnen.
function collectBillboards(){
  const list=[];
  for(let i=0;i<plots.length;i++){
    const pr=project(plots[i].x,plots[i].y); if(!pr) continue;
    refreshTreeArt(i);
    list.push({forward:pr.forward, draw:()=>blitArt(pr,treeArt[i],TREE_ART_AX,TREE_ART_AY)});
  }
  for(const [pos,art] of [[WELL,wellArt],[STALL,stallArt],[SHED,shedArt]]){
    const pr=project(pos.x,pos.y); if(!pr) continue;
    list.push({forward:pr.forward, draw:()=>blitArt(pr,art,STA_AX,STA_AY)});
  }
  { const pr=project(BANNER_POS.x,BANNER_POS.y);
    if(pr) list.push({forward:pr.forward, draw:()=>blitArt(pr,bannerArt,BANNER_AX,BANNER_AY)}); }
  for(const post of fencePosts){
    const pr=project(post.x,post.y); if(!pr) continue;
    list.push({forward:pr.forward, draw:()=>drawPropBillboard(post.x,post.y,6,46,'#7a5a34')});
  }
  for(const p of grassPatches){
    const pr=project(p.x,p.y); if(!pr) continue;
    list.push({forward:pr.forward, draw:()=>drawGroundScatter(pr,p.rx,p.ry,'rgba(255,255,255,.10)')});
  }
  for(const f of flowers){
    const pr=project(f.x,f.y); if(!pr) continue;
    list.push({forward:pr.forward, draw:()=>drawGroundScatter(pr,3.4,3.4,f.h>0.5?'#ffe08a':'#ff9db0')});
  }
  return list;
}
function render(dt){
  drawSkyAndGround();
  const bills=collectBillboards();
  bills.sort((a,b)=>b.forward-a.forward); // am weitesten entfernt zuerst zeichnen (Übermalen näherer Objekte)
  for(const b of bills) b.draw();
  drawAimHighlight();
  drawFloatsFP(dt);
  drawDuskOverlay();
}
// ---- Steuerungs-Overlay (Schritt 2/3): Joystick-Basis/Knauf links (nur solange aktiv) +
// zentrales Fadenkreuz, das sich verfärbt/vergrößert, sobald aimTarget() etwas Interaktives
// findet (siehe updateAimUI()). Reines Canvas-Overlay (kein extra DOM) — liegt zwar über der
// Szene, aber unter #amenu/#modal/#btnInteract (eigene, höher gestapelte DOM-Elemente).
function drawControlsOverlay(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(input.moveTouchId!=null){
    ctx.save();
    ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,.55)';
    ctx.globalAlpha=1;
    ctx.beginPath(); ctx.arc(input.joyOrigin.x,input.joyOrigin.y,JOY_MAX_R,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='rgba(255,215,106,.85)';
    ctx.beginPath();
    ctx.arc(input.joyOrigin.x+input.joyDX,input.joyOrigin.y+input.joyDY,20,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  const rx=cw/2, ry=ch/2, aimed=!!currentAim, rad=aimed?9.5:7;
  ctx.save();
  ctx.strokeStyle=aimed?'rgba(255,215,106,.95)':'rgba(255,255,255,.8)'; ctx.lineWidth=aimed?2.2:1.5;
  ctx.beginPath(); ctx.arc(rx,ry,rad,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle=aimed?'rgba(255,215,106,.95)':'rgba(255,255,255,.85)';
  ctx.beginPath(); ctx.arc(rx,ry,1.6,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
// ---- Kontext-Prompt/Aktions-Button: jeden Frame neu bestimmen, worauf das Fadenkreuz zeigt,
// und DOM-Overlay (#actionPrompt, #btnInteract, Fortschrittsbalken) entsprechend aktualisieren.
function aimLabel(a){
  if(!a) return null;
  if(a.kind==='plot'){
    const p=plots[a.idx];
    if(!p.unlocked) return {title:'🚧 Baum #'+(a.idx+1), hint:'Im Laden freischalten', locked:true};
    const acts=plotActions(p);
    if(acts.length===0) return {title:'🌳 Baum #'+(a.idx+1), hint:'Gerade nichts zu tun', locked:true};
    const first=TASKDEFS[acts[0].type];
    return {title:'🌳 Baum #'+(a.idx+1), hint:first.icon+' '+first.label+(acts.length>1?' u.a.':''), locked:false};
  }
  if(a.kind==='well'){
    const ok=player.can<canCap(player);
    return {title:'🚰 Brunnen', hint:ok?'Kanne füllen':'Kanne ist voll', locked:!ok};
  }
  if(a.kind==='stall'){
    const ok=player.carry>0;
    return {title:'💰 Feststand', hint:ok?'Verkaufen ('+player.carry+')':'Nichts zu verkaufen', locked:!ok};
  }
  if(a.kind==='shed') return {title:'🛒 Laden', hint:'Öffnen', locked:false};
  return null;
}
const actionPromptEl=document.getElementById('actionPrompt'),
      actionBarWrapEl=document.getElementById('actionBarWrap'),
      actionBarEl=document.getElementById('actionBar'),
      btnInteractEl=document.getElementById('btnInteract');
function updateAimUI(){
  currentAim=(state.paused||state.over)?null:aimTarget();
  const info=aimLabel(currentAim);
  if(!info){
    actionPromptEl.classList.add('hidden');
    btnInteractEl.classList.add('off');
  } else {
    actionPromptEl.classList.remove('hidden');
    actionPromptEl.innerHTML=`<div>${info.title}</div><div>${info.hint}</div>`;
    btnInteractEl.classList.toggle('off',!!info.locked);
  }
  if(activeAction){
    actionBarWrapEl.classList.remove('hidden');
    actionBarEl.style.width=Math.round(100*clamp(activeAction.prog/activeAction.dur,0,1))+'%';
    btnInteractEl.classList.add('active');
  } else {
    actionBarWrapEl.classList.add('hidden');
    btnInteractEl.classList.remove('active');
  }
}

// ---------------------------------------------------------------- Spielschleife
function update(dt){
  if(state.paused||state.over) return;
  if(activeAction) updateActiveAction(dt); else updatePlayerControls(dt);
  state.t+=dt;
  state.dayT+=dt/DAYLEN;
  if(state.dayT>=1){ state.dayT=0; newDay(); }
  daybar.style.width=Math.round(state.dayT*100)+'%';
  // Preis-Random-Walk
  state.priceT+=dt;
  if(state.priceT>=2){
    state.priceT=0;
    state.price=clamp(state.price+rnd(-1,1)*(1+state.day*0.15),6,28);
    hPrice.textContent=Math.round(state.price);
  }
  spawnPests(dt);
  for(const p of plots) updateTree(p,dt);
  state.checkT+=dt;
  if(state.checkT>=1){ state.checkT=0; checkWin(); checkBankrupt(); updateHUD(); }
}
let last=performance.now();
function frame(now){
  let dt=Math.min((now-last)/1000,0.1); last=now;
  dt*=(window.__speed||1);
  update(dt);
  updateAimUI();
  render(dt);
  drawControlsOverlay();
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- Buttons
document.getElementById('btnShop').addEventListener('click',()=>{ ac(); openShop(); });
document.getElementById('btnHelp').addEventListener('click',()=>{ ac(); showTutorial(); });
document.getElementById('btnPause').addEventListener('click',()=>{
  if(state.over) return;
  if(modal.classList.contains('hidden')){
    showModal('<h2>⏸ Pause</h2><p>Die Dominiks warten geduldig am Baum. Also … relativ geduldig.</p><div class="btnrow"><button class="primary" data-act="resume">Weiter 🚜</button></div>');
  }
});

// ---------------------------------------------------------------- Start
loadAssets().then(()=>{
  prepSprites();
  prepStationArt();     // Brunnen/Feststand/Laden/Banner einmalig als Billboard-Kunstwerk vorrendern
  updateHUD();
  resize();
  document.getElementById('loading').remove();
  if(localStorage.getItem('edf_tut')) { state.paused=false; toast('🌳 Auf geht\'s! Lauf los und leg los.','good'); }
  else showTutorial();
  requestAnimationFrame(frame);
}).catch(err=>{
  document.getElementById('loading').innerHTML='😢 '+err.message;
});

// Test-/Debug-Schnittstelle
window.game={ state, inv, upg, plots, player,
  worldToScreen, screenToWorld, openShop,
  project, groundScreenY, horizonFrac:()=>HORIZON_FRAC, focal:()=>focal,
  tick(sec){ const step=0.05; for(let t=0;t<sec;t+=step){ update(step); updateAimUI(); } },
  // Schritt 2/3: Steuerung/Kollision/Zielsuche/Ego-Interaktion
  input, movePlayer, collisionObstacles, aimTarget,
  startAction, doInteract, plotActions, canDoNow, completeTask,
  get activeAction(){return activeAction;},
  get currentAim(){return currentAim;},
};
</script>
