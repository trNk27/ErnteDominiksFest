<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover schiebt das Bild unter Notch und Gestenbalken, damit auf
     dem Handy kein grauer Streifen bleibt; die HUD-Ecken halten sich mit
     env(safe-area-inset-*) selbst davon frei (siehe #hud/#hotbar/#touch unten).
     Zoomen ist aus: ein Doppeltipp beim Abbauen soll den Block treffen und
     nicht die Seite vergrößern. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#1d331d">
<!-- Vom Startbildschirm aus startet das Spiel ohne Browserleiste — auf dem
     Handy der zuverlässigste Weg zum echten Vollbild, unabhängig davon, ob
     die Fullscreen-Schnittstelle mitspielt (siehe goFullscreen in game.js). -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:,">
<title>ErnteDominiksFest</title>
<style>
  /* Pixelschrift, lokal unter vendor/font (SIL Open Font License 1.1).
     Variabel, deshalb deckt eine Datei 400 bis 700 ab. */
  @font-face{
    font-family:'Pixelify Sans';
    src:url('./vendor/font/pixelify-sans-latin.woff2') format('woff2');
    font-weight:400 700;font-style:normal;font-display:swap;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  /* 100dvh statt 100%: auf dem Handy wächst und schrumpft die Browserleiste
     beim Scrollen, und eine an 100vh gehängte Leiste rutscht dann unter den
     Bildrand. dvh misst, was gerade wirklich zu sehen ist. */
  html,body{height:100%;height:100dvh;overflow:hidden;background:#0e1a0e}
  body{
    font-family:'Pixelify Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;
    user-select:none;-webkit-user-select:none;
  }
  /* Der harte Schattenversatz gehört zum Klötzchen-Look dazu. */
  #hud,#vitals,#toasts,#tip,#mbox h2,#mbox h3,.recipe .nm,#hotbar .slot .n{
    text-shadow:2px 2px 0 rgba(0,0,0,.5)
  }
  /* touch-action:none nimmt dem Browser das Wischen, Wippen und Doppeltipp-
     Zoomen ab — sonst scrollt beim Umsehen die Seite statt der Blick, und ein
     langer Druck aufs Bild öffnet das Auswahlmenü statt abzubauen. */
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  button{font-family:inherit;color:inherit}

  /* Hier ausdrücklich KEIN touch-action:none: die Regel gälte auch für alles
     darin, und #mbox/#mside sind scrollbar (overflow-y:auto) — das Rezeptbuch
     ließe sich sonst am Finger nicht mehr durchblättern. Das Wischen abwürgen
     müssen nur die Stellen, die selbst eine Geste tragen: das Bild (canvas),
     das Steuerkreuz und die Daumenknöpfe. */
  #ui{position:absolute;inset:0;pointer-events:none;z-index:10}
  /* Nichts im Spiel ist Text zum Markieren, und der lange Druck (Abbauen!)
     darf nirgends die Lupe des Systems aufrufen. */
  #ui,#ui *{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

  /* ---------- Kopfzeile: nur Ziel-Fortschritt und Pause ---------- */
  #hud{
    position:absolute;display:flex;align-items:flex-start;gap:8px;
    top:calc(8px + env(safe-area-inset-top));
    left:calc(10px + env(safe-area-inset-left));
    right:calc(10px + env(safe-area-inset-right))
  }
  #book{
    background:rgba(12,22,12,.72);border:1px solid rgba(255,255,255,.14);border-radius:11px;
    padding:5px 10px;font-size:13px;font-weight:800;backdrop-filter:blur(6px);
    display:flex;align-items:center;gap:3px;flex-wrap:wrap
  }
  #book img{width:16px;height:16px;object-fit:contain}
  #book img:nth-of-type(2){margin-left:9px}
  /* Die Kasse ist das Ziel, also darf sie auffallen. */
  #book .cash{margin-left:11px;color:#ffd76a}
  #book .goal{margin-left:8px;opacity:.8}
  #book.full{border-color:#ffd76a;color:#ffd76a}
  #book.rich .goal{color:#7dff8a;opacity:1}
  #topbtns{margin-left:auto;display:flex;gap:6px;pointer-events:auto}
  #topbtns button{
    background:rgba(12,22,12,.72);border:1px solid rgba(255,255,255,.16);border-radius:11px;
    width:38px;height:38px;font-size:16px;cursor:pointer;backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center
  }
  #topbtns button img{width:21px;height:21px;object-fit:contain}
  #topbtns button:active{transform:scale(.92)}

  /* ---------- Fadenkreuz ---------- */
  #cross{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:22px;height:22px;opacity:.85;transition:opacity .15s,transform .12s
  }
  #cross i{position:absolute;background:#fff;border-radius:2px;box-shadow:0 0 3px rgba(0,0,0,.7)}
  #cross i:nth-child(1){left:50%;top:0;width:2px;height:7px;margin-left:-1px}
  #cross i:nth-child(2){left:50%;bottom:0;width:2px;height:7px;margin-left:-1px}
  #cross i:nth-child(3){top:50%;left:0;height:2px;width:7px;margin-top:-1px}
  #cross i:nth-child(4){top:50%;right:0;height:2px;width:7px;margin-top:-1px}
  #cross.hot{transform:translate(-50%,-50%) scale(1.3);opacity:1}
  #cross.hot i{background:#ffd76a}
  #cross.swing{transform:translate(-50%,-50%) rotate(38deg) scale(1.5)}

  /* Abbau-Fortschritt direkt unterm Fadenkreuz */
  #mine{
    position:absolute;left:50%;top:calc(50% + 22px);transform:translateX(-50%);
    width:56px;height:5px;background:rgba(0,0,0,.45);border-radius:3px;overflow:hidden;display:none
  }
  #mine i{display:block;height:100%;width:0;background:#ffd76a}

  /* Name des angepeilten Blocks */
  #tip{
    position:absolute;left:50%;top:calc(50% + 36px);transform:translateX(-50%);
    font-size:12.5px;font-weight:700;opacity:.65;text-shadow:0 1px 3px #000;white-space:nowrap
  }

  /* ---------- Treffer-Overlay ---------- */
  #hurt{
    position:absolute;inset:0;opacity:0;pointer-events:none;
    box-shadow:inset 0 0 90px 20px rgba(190,20,20,.85);transition:opacity .12s
  }

  /* ---------- Unter Wasser ---------- */
  /* Blauer Schleier mit dunklen Rändern — dazu wird im Spiel der Nebel kurz
     und blau gestellt, damit man das Untertauchen sofort sieht. */
  #water{
    position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .2s;
    background:rgba(29,92,143,.36);
    box-shadow:inset 0 0 120px 30px rgba(10,40,70,.55)
  }

  /* ---------- Herzen & Hunger ---------- */
  #vitals{
    position:absolute;left:50%;bottom:62px;transform:translateX(-50%);
    width:min(92vw,440px);display:flex;justify-content:space-between;
    font-size:14px;line-height:1;text-shadow:0 1px 3px #000
  }
  #vitals>div{display:flex;gap:1px}
  #vitals img.vit{
    width:16px;height:16px;object-fit:contain;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))
  }

  /* ---------- Inventarleiste ---------- */
  #hotbar{
    position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px;
    bottom:calc(10px + env(safe-area-inset-bottom))
  }
  #hotbar .slot{
    position:relative;width:44px;height:44px;border:2px solid rgba(255,255,255,.3);
    background:rgba(12,22,12,.6);border-radius:6px;display:flex;align-items:center;
    justify-content:center;font-size:21px;backdrop-filter:blur(4px);
    cursor:pointer;pointer-events:auto
  }
  #hotbar .slot.sel{border-color:#fff;background:rgba(90,90,60,.7);box-shadow:0 0 0 2px rgba(255,255,255,.25)}
  #hotbar .slot .i{
    display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;pointer-events:none
  }
  #hotbar .slot .n{
    position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:800;
    text-shadow:1px 1px 0 #000,-1px 1px 0 #000
  }
  @media (max-height:420px){#hotbar .slot{width:36px;height:36px;font-size:17px}}

  /* ---------- Inventarfenster ---------- */
  #mbox .invgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:6px 0}
  /* Kochtopf-Zutatenraster: POT_CAP=12 Fächer, 4 breit statt der 9 des
     Rucksacks — sonst bleibt alles wie beim Rucksack/der Truhe (repeat(N,1fr)
     plus aspect-ratio:1 von #mbox .cell oben), bewusst OHNE feste Zellbreite,
     damit im Handy-Hochformat nichts über den Fensterrand hinausläuft (s.
     Auftragsnotiz zum Kochfenster). */
  #mbox .invgrid.potgrid{grid-template-columns:repeat(4,1fr)}
  #mbox .cell{
    position:relative;aspect-ratio:1;border:1px solid rgba(255,255,255,.16);border-radius:7px;
    background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;
    font-size:19px;cursor:pointer
  }
  #mbox .cell.bar{background:rgba(255,255,255,.12)}
  #mbox .cell:hover{border-color:rgba(255,215,106,.65);background:rgba(255,215,106,.12)}

  /* ---------- Stapel am Mauszeiger ---------- */
  #carry{
    position:fixed;left:0;top:0;z-index:50;width:44px;height:44px;display:none;
    align-items:center;justify-content:center;font-size:21px;pointer-events:none;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))
  }
  #carry img.ic{width:38px;height:38px}

  /* ---------- Schwebehilfe ---------- */
  #itip{
    position:fixed;left:0;top:0;z-index:55;display:none;pointer-events:none;
    max-width:230px;padding:6px 9px;border-radius:9px;
    background:rgba(10,18,10,.95);border:1px solid #4a774a;
    box-shadow:0 4px 14px rgba(0,0,0,.5);line-height:1.35
  }
  #itip b{display:block;font-size:13px;color:#ffd76a}
  #itip i{display:block;font-style:normal;font-size:11.5px;opacity:.8;margin-top:2px}
  #carry .n{
    position:absolute;right:0;bottom:-1px;font-size:12px;font-weight:800;
    text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000
  }
  #mbox .cell .n{
    position:absolute;right:3px;bottom:1px;font-size:11.5px;font-weight:800;
    text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000
  }
  #mbox h3{font-size:12px;opacity:.7;margin:10px 0 0;text-transform:uppercase;letter-spacing:.5px}

  /* ---------- Manni-Markt ---------- */
  /* Nichts Neues erfunden: Annahme und Auslage sind dieselben .cell/.pc-
     Kästchen wie überall sonst im Fenster, nur zu zweien Reihen sortiert. */
  #mbox .cell.accept{
    width:72px;margin:8px auto;font-size:30px;border:2px dashed #4a774a;
    background:rgba(255,215,106,.06)
  }
  #mbox .cell.accept:hover{border-color:#ffd76a;background:rgba(255,215,106,.16)}
  /* Unbezahlbares in der Auslage bleibt sichtbar, aber blass — wie ein
     Rezept ohne Zutaten (.rec.off/.recipe.off) blass bleibt. */
  #mbox .cell.off{opacity:.4;cursor:default}
  #mbox .cell.off:hover{border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.05)}
  /* Der angezogene Skin in der Auslage — derselbe "aktiv"-Rahmen wie beim
     gewählten Leistenfach (#hotbar .slot.sel), nur hier statt der Leiste. */
  #mbox .cell.sel{border-color:#fff;background:rgba(255,255,255,.14);box-shadow:0 0 0 2px rgba(255,255,255,.25)}

  /* ---------- Gegenstandsbildchen ---------- */
  /* Ein Sprite füllt seine Zelle zu gut drei Vierteln; fehlt es, steht an
     seiner Stelle der alt-Text — dann greift die Schriftgröße der Zelle. */
  img.ic{width:78%;height:78%;object-fit:contain;pointer-events:none}
  .cell img.ic{filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
  img.ic.mini{width:15px;height:15px;vertical-align:-3px;display:inline-block}
  .ds .dot{
    display:inline-block;width:15px;height:15px;vertical-align:-3px;position:relative
  }
  .ds .dot::after{
    content:'';position:absolute;left:6px;top:7px;width:3px;height:3px;
    border-radius:50%;background:currentColor;opacity:.4
  }
  .ds .sep{margin:0 4px;opacity:.45;font-weight:400}

  /* ---------- Handwerksfeld 2x2 / 3x3 ---------- */
  .craft{
    display:flex;align-items:center;justify-content:center;gap:12px;
    background:#162816;border:1px solid #3a5f37;border-radius:12px;padding:12px;margin:8px 0
  }
  .craft .cgrid{display:grid;gap:4px}
  .craft .cgrid.c2{grid-template-columns:repeat(2,46px)}
  .craft .cgrid.c3{grid-template-columns:repeat(3,46px)}
  .craft .cell{width:46px;height:46px;aspect-ratio:auto;font-size:22px}
  .craft .arrow{font-size:20px;opacity:.6}
  .craft .cell.res{
    width:54px;height:54px;font-size:26px;border-color:#b0722a;background:rgba(176,114,42,.22);
    box-shadow:0 0 0 2px rgba(255,215,106,.2)
  }
  .craft .cell.res.empty{border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.04);box-shadow:none}
  .hint{font-size:11px;opacity:.6;text-align:center;margin:-4px 0 4px}

  /* ---------- Kochtopf-Fenster ---------- */
  /* Zutatenraster (.invgrid.potgrid) steht oben für sich (s. dort); dieser
     Streifen darunter trägt nur den Pfeil-Knopf "Kochen"/"Nochmal" und die
     Ergebniszelle, genau wie .craft das für die Werkbank tut — wenige feste
     Größen sind hier unproblematisch, weil nie mehr als drei Elemente
     nebeneinanderstehen (kein repeat(N,1fr)-Raster, das im Hochformat
     umbrechen müsste). */
  .potcook{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0}
  .potbtn{
    padding:9px 16px;border-radius:10px;border:1px solid #4a774a;background:#213b21;
    color:#eaffea;font-weight:800;font-size:13px;letter-spacing:.3px;cursor:pointer
  }
  .potbtn:hover{border-color:#ffd76a;background:#2b4a2b}
  .potbtn.off{opacity:.42;cursor:default;pointer-events:none}
  .potcook .cell.res{
    width:54px;height:54px;aspect-ratio:auto;font-size:26px;border-color:#b0722a;
    background:rgba(176,114,42,.22);box-shadow:0 0 0 2px rgba(255,215,106,.2)
  }
  .potcook .cell.res.empty{border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.04);box-shadow:none}
  .potcook .arrow{font-size:20px;opacity:.6}

  /* Muster in Rezeptkarten */
  .patwrap{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0}
  .patwrap .pat{display:grid;gap:3px}
  .patwrap .pc{
    position:relative;width:30px;height:30px;border:1px solid rgba(255,255,255,.16);
    border-radius:6px;background:rgba(255,255,255,.05);
    display:flex;align-items:center;justify-content:center;font-size:17px
  }
  .patwrap .pc.res{width:38px;height:38px;font-size:21px;border-color:#b0722a;background:rgba(176,114,42,.22)}
  .patwrap .pc img.ic{width:82%;height:82%}
  .patwrap .pc .n{position:absolute;right:2px;bottom:0;font-size:10px;font-weight:800;
    text-shadow:1px 1px 0 #000,-1px 1px 0 #000}

  /* ---------- Toasts ---------- */
  #toasts{
    position:absolute;left:50%;top:86px;transform:translateX(-50%);
    display:flex;flex-direction:column;gap:4px;align-items:center;width:max-content;max-width:80vw
  }
  .toast{
    background:rgba(12,22,12,.9);border:1px solid #4a774a;border-radius:16px;
    padding:6px 14px;font-size:13px;font-weight:700;text-align:center;animation:ti .2s ease-out
  }
  .toast.good{border-color:#7dff8a;color:#c9ffcf}
  .toast.warn{border-color:#ffb33c;color:#ffd76a}
  .toast.bad{border-color:#ff5c5c;color:#ffb0b0}
  .toast.out{opacity:0;transition:opacity .35s}
  @keyframes ti{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* ---------- Modal ---------- */
  /* In den Fenstern trägt der Zeiger die Hacke. Die 32er-Fassung zuerst:
     größere Zeiger lehnen manche Browser stillschweigend ab, und ein Zeiger,
     der gar nicht erscheint, wäre schlimmer als ein etwas grober. */
  #modal,#hotbar .slot,#topbtns button{
    cursor:url('./sprites/ui/farming_cursor_32.png') 4 4,
           url('./sprites/ui/farming_cursor_64.png') 8 8, pointer
  }
  #modal{
    position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.66);padding:10px;pointer-events:auto
  }
  #modal.hidden{display:none}
  /* Fenster und Rezeptleiste stehen nebeneinander; wird es zu schmal,
     rutscht die Leiste unter das Fenster statt zu verschwinden.
     width:100% ist hier wichtig: ohne das misst sich #mwrap an seinem INHALT
     (shrink-to-fit im umgebenden Flexbereich), und #mbox' eigenes width:100%
     zeigt dann auf genau diese Inhaltsbreite. Das Fenster wäre damit so
     breit wie das, was gerade darin steht — ein leerer Rucksack machte es
     schmal genug, dass die Rezeptleiste daneben nicht mehr passte und
     umbrach, und jeder Klick, der eine Stapelzahl verschwinden lässt, ließ
     es ein Stück schrumpfen. Mit fester Wrapper-Breite ist #mbox immer
     560px (bzw. so viel Platz wie da ist), egal was darin liegt. */
  #mwrap{
    display:flex;gap:10px;align-items:flex-start;justify-content:center;
    flex-wrap:wrap;width:100%;max-width:100%;max-height:100%
  }
  #mbox{
    background:#1a2e1a;border:2px solid #4a774a;border-radius:16px;padding:14px;
    width:560px;max-width:100%;flex:0 1 560px;min-width:0;
    max-height:94vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.6)
  }
  #mside{
    width:250px;flex:none;max-height:94vh;overflow-y:auto;
    background:#16281a;border:2px solid #4a774a;border-radius:16px;padding:10px 11px;
    box-shadow:0 12px 40px rgba(0,0,0,.6)
  }
  #mside.hidden{display:none}
  #mside h3{margin-top:0}

  /* ---------- Ein Rezept als Muster ---------- */
  /* Kein Knopf: das Muster steht da, hinlegen muss man es selbst. */
  .rec{margin:0 0 7px;padding:5px 7px;background:rgba(255,255,255,.05);border-radius:9px}
  .rec.off{opacity:.42}
  .rec .rt{font-size:12px;font-weight:800;color:#ffd76a;margin-bottom:1px}
  .rec .patwrap{margin:2px 0 0;gap:7px}
  .rec .patwrap .pc{width:22px;height:22px;font-size:13px}
  .rec .patwrap .pc.res{width:26px;height:26px;font-size:15px}
  .rec .patwrap .arrow{font-size:13px}
  .sidenote{font-size:11px;opacity:.6;line-height:1.4;margin-top:6px}
  #mbox h2{color:#ffd76a;font-size:21px;letter-spacing:.5px;text-align:center;margin-bottom:7px}
  #mbox p{font-size:13.5px;line-height:1.6;margin-bottom:7px}
  #mbox .kbd{font-size:13px;opacity:.85;line-height:1.85}
  #mbox .kbd b{
    display:inline-block;min-width:22px;text-align:center;background:#0f1c0f;border-radius:5px;
    border:1px solid #4a774a;padding:1px 5px;margin-right:5px;font-size:11.5px
  }
  .recipe{
    display:flex;align-items:center;gap:8px;background:#22401f;border:1px solid #3a5f37;
    border-radius:10px;padding:6px 8px;margin-bottom:5px
  }
  .recipe.off{opacity:.45}
  .recipe .ico{
    font-size:20px;width:28px;height:28px;flex:none;
    display:flex;align-items:center;justify-content:center
  }
  .recipe .ico img.ic{width:100%;height:100%}
  .recipe .txt{flex:1;min-width:0}
  .recipe .nm{font-weight:800;font-size:14px}
  .recipe .ds{font-size:12px;opacity:.8;line-height:1.3}
  .recipe button{
    background:#b0722a;border:none;border-radius:8px;padding:7px 10px;
    font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap
  }
  .recipe button:disabled{background:#3b3b3b;opacity:.6;cursor:default}
  .btnrow{
    display:flex;gap:8px;margin-top:10px;position:sticky;bottom:-14px;
    background:#1a2e1a;padding:8px 0 6px;z-index:2
  }
  .btnrow button{
    flex:1;background:#3f6b3f;border:none;border-radius:10px;padding:11px;
    font-size:15px;font-weight:800;cursor:pointer
  }
  .btnrow button.primary{background:#b0722a}
  .btnrow button:active{transform:scale(.97)}
  .btnrow button:disabled{background:#3b3b3b;opacity:.6;cursor:default;transform:none}
  .page{
    background:#2b2415;border:1px solid #7a6338;border-radius:10px;padding:10px 12px;
    font-size:14px;line-height:1.65;color:#f0e2bd;margin-bottom:6px
  }
  .page b{color:#ffd76a}

  /* ---------- Handysteuerung ---------- */
  /* Alles hier drin gibt es nur auf Geräten, die mit dem Finger bedient
     werden (body.touch, gesetzt in game.js). Am Schreibtisch bleibt der
     Bildschirm frei — eine Maus braucht kein Steuerkreuz. */
  #touch{display:none}
  body.touch #touch{display:block}
  /* Der linke Daumen läuft, der rechte sieht sich um: das Steuerkreuz sitzt
     fest in der unteren linken Ecke, der Rest des Bildes ist Blickfeld
     (siehe die Gestenerkennung in game.js). */
  /* Unten am Bildrand liegt schon ein voller Streifen: Inventarleiste (ganz
     unten) und darüber Herzen und Hunger. Steuerkreuz und Knöpfe fangen
     deshalb erst oberhalb davon an — säßen sie tiefer, verdeckte der linke
     Daumen genau die Fächer, aus denen er gleich etwas wählen will. */
  #stick{
    position:absolute;pointer-events:auto;
    left:calc(18px + env(safe-area-inset-left));
    bottom:calc(92px + env(safe-area-inset-bottom));
    width:min(34vw,132px);height:min(34vw,132px);border-radius:50%;
    background:rgba(12,22,12,.42);border:2px solid rgba(255,255,255,.22);
    backdrop-filter:blur(3px);touch-action:none
  }
  #stick i{
    position:absolute;left:50%;top:50%;width:42%;height:42%;border-radius:50%;
    background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.75);
    transform:translate(-50%,-50%);pointer-events:none;
    box-shadow:0 2px 8px rgba(0,0,0,.5)
  }
  /* Die Knöpfe für den rechten Daumen. Sie liegen über der Inventarleiste,
     nicht daneben: quer gehalten ist unten in der Mitte kein Platz mehr. */
  #tbtns{
    position:absolute;display:flex;flex-direction:column;gap:8px;align-items:flex-end;
    right:calc(16px + env(safe-area-inset-right));
    bottom:calc(92px + env(safe-area-inset-bottom))
  }
  #tbtns button{
    pointer-events:auto;width:min(15vw,62px);height:min(15vw,62px);border-radius:50%;
    background:rgba(12,22,12,.6);border:2px solid rgba(255,255,255,.28);
    font-size:min(6.5vw,25px);display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(4px);cursor:pointer;touch-action:none
  }
  #tbtns button:active,#tbtns button.on{background:rgba(90,90,60,.75);border-color:#fff}
  /* Aussteigen zeigt sich nur, wenn man wirklich in etwas sitzt. Der Wähler
     muss den von "#tbtns button" oben schlagen (eine ID plus ein Element),
     ein schlichtes "#btnExit" wäre schwächer und der Knopf stünde immer da. */
  #tbtns #btnExit{display:none}
  body.riding #tbtns #btnExit{display:flex}
  /* Am Finger bedient darf die Leiste ruhig etwas größer sein — und die
     Herzen rutschen entsprechend höher, damit sie nicht darunterliegen. */
  /* Neun Fächer plus acht Fugen müssen nebeneinander auf den Bildschirm
     passen — ein glatter vw-Anteil je Fach vergisst die Fugen und schiebt die
     Leiste am Handy über den Rand hinaus. Darum die Breite aus dem, was nach
     Fugen und Sicherheitsrändern übrig bleibt, und nach oben bei 46px gedeckelt,
     damit sie auf dem Tablet nicht ins Alberne wächst. */
  body.touch #hotbar{gap:3px}
  body.touch #hotbar .slot{
    width:min(calc((100vw - 36px - env(safe-area-inset-left) - env(safe-area-inset-right))/9),46px);
    height:min(calc((100vw - 36px - env(safe-area-inset-left) - env(safe-area-inset-right))/9),46px);
    touch-action:none
  }
  body.touch #vitals{bottom:calc(66px + env(safe-area-inset-bottom))}
  /* Quer gehalten ist die Höhe knapp: Steuerkreuz und Knöpfe schrumpfen mit,
     sonst decken sie die halbe Landschaft zu. */
  @media (max-height:460px){
    #stick{width:min(22vh,100px);height:min(22vh,100px)}
    #tbtns{gap:6px}
    #tbtns button{width:min(11vh,52px);height:min(11vh,52px);font-size:min(5vh,21px)}
  }
  /* Fenster am Finger. KEINE Mindestbreite für die Zellen: das Rucksackraster
     hat neun Spalten (repeat(9,1fr)), und neun mal irgendeine feste Breite
     sprengt ein Handy im Hochformat sofort — die rechten Fächer lägen außerhalb
     des Fensters. Die Zellen sind ohnehin quadratisch (aspect-ratio:1) und
     teilen sich die Breite; mehr Fläche für den Daumen holt man hier also
     nicht über eine Mindestgröße, sondern indem Rand und Fugen schrumpfen. */
  body.touch #mbox{padding:10px 8px}
  body.touch #mbox .invgrid{gap:3px}

  /* ---------- Ladebildschirm ---------- */
  #boot{
    position:absolute;inset:0;z-index:40;background:#142614;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;font-weight:800;color:#ffd76a;font-size:17px
  }
</style>
</head>
